    {f:"dev",l:"Adj. device",t:"sel",o:["device"]}
  ]};
  gz.params = [
    {id:"GZ1",l:"Floor area — direct contact / slab (m²)",t:"num",u:"m²",src:"Split of G10 by floor construction (slab-on-ground home ⇒ = G10)"},
    {id:"GZ2",l:"Floor area — ground suspended (m²)",t:"num",u:"m²",src:"Sections / structural",def:"0"},
    {id:"GZ3",l:"Floor area — suspended upper storey(s) (m²)",t:"num",u:"m²",src:"Upper floor plan",def:"0"},
    {id:"GZ4",l:"Air movement",t:"sel",o:["Standard","High"],src:"NCC calc v4.3 constants: Standard",def:"Standard"},
    {id:"GZ6",l:"Optimiser: frame material preference",t:"sel",o:["Any"].concat([...new Set(GD.WERS.map(w=>w.mat))].sort()),src:"Specification / budget — narrows the WERS search",def:"Any"},
    {id:"GZ5",l:"CZ5 only: full brick house (internal brick + ext. brick cavity)",t:"sel",o:GD.BrickCavity.filter(Boolean),src:"↳ cross-checked against W1",def:"No"}
  ];
  gz.intro = "<p><b>Part 13.3 sets no required U-Value or SHGC for any single window.</b> It sets two whole-of-dwelling budgets and lets the glazing meet them as a package. That is why a poor window can be carried by better ones — and why changing any one window changes the result for all of them.</p><p><b>Two tests, run together.</b><br><b>13.3.2 — winter</b> (climate zones 2–8). Heat lost through the glazing, divided by the useful solar heat it gains in winter, must not exceed the conductance allowance C<sub>U</sub>:<br><code>Σ(A · U · κ) ÷ Σ(A · SHGC · E<sub>w</sub> · ω) ≤ C<sub>U</sub></code><br><b>13.3.3 — summer</b> (climate zones 1–7). Solar heat gained in summer must not exceed C<sub>SHGC</sub> × the total floor area:<br><code>Σ(A · SHGC · E<sub>s</sub> · σ) ≤ C<sub>SHGC</sub> × A<sub>floor</sub></code><br>Zone 1 runs summer only; zone 8 winter only; zones 2–7 both.</p><p><b>Where each term comes from.</b> <i>A</i> — the opening area, height × width or the stated area, whichever is greater. <i>U</i> and <i>SHGC</i> — whole-of-system values including the frame, off the WERS certificate; SHGC is capped at 0.70 in the calculation however high the product's actual figure. <i>E<sub>w</sub></i> / <i>E<sub>s</sub></i> — exposure for the opening's orientation, interpolated on its shading ratio P/H (projection over height), capped at 2; an adjustable external device counts as P/H = 2 in summer. <i>κ, ω, σ</i> — multipliers for orientation, room type, storey, frame colour and floor finish. <i>C<sub>U</sub></i> and <i>C<sub>SHGC</sub></i> — climate-zone constants, weighted between slab-on-ground and suspended floor by their share of the floor area, and adjusted for air movement.</p><p><b>The tension is deliberate.</b> Winter rewards a high SHGC and a low U; summer punishes a high SHGC. Shading is what separates them, because an eave cuts the summer sun far more than the winter sun — which is why P/H, rather than the glass alone, usually decides whether a design complies. The optimiser below solves both constraints at once against the WERS library and returns the highest average U-Value that still passes, i.e. the least expensive compliant glazing.</p><p><b>Read the headroom, not just the pass.</b> Each result is reported as a figure against its allowance with the margin between them. A design sitting a few per cent under the limit will not survive a window substitution without reassessment.</p>";
  /* Two calculators, deliberately separate. The first answers "what do I
     need?" and never reads the proposed windows. The second answers "does
     what has been drawn comply?" and never writes to them. */
  gz.title = "6 · 13.3 External glazing — REQUIRED specification";
  gz.calcs = [
    {id:"C_GZ3",l:"Required specification — cheapest WERS windows that comply (13.3.2 + 13.3.3)",fn:"calc_gzOptimise"}
  ];
  const gzp = {
    id:"GZP", pg:"h6", title:"6b · 13.3 External glazing — compliance AS PROPOSED",
    rpt:"13.3", rsec:"2.4", grp:gz.grp, linked:["G3","G9","G10"], collRef:"GZ", params:[],
    intro:"<p>The section above says what the glazing <b>needs</b> to be. This one checks what has "
      +"actually been specified in the schedule — the U-Value and SHGC columns — against the same two "
      +"tests. Nothing here is written by the optimiser, so a pass here is a real pass.</p>"
      +"<p>While no windows have been chosen yet, mark this section <b>N/A</b>. It will report the gap "
      +"the moment values are entered.</p>",
    calcs:[
      {id:"C_GZ1",l:"Winter outcome as proposed — CU/CSHGC ratio vs allowance (13.3.2, CZ2–8)",fn:"calc_gzWinter"},
      {id:"C_GZ2",l:"Summer outcome as proposed — SHGC load vs allowance (13.3.3, CZ1–7)",fn:"calc_gzSummer"}
    ]
  };
  if(!SEC.some(s=>s.id==="GZP")) SEC.splice(SEC.indexOf(gz)+1, 0, gzp);
  if(!S.coll.gl) S.coll.gl=[];
})();

/* linkedRow: search every section, not just Globals */
function linkedRow(gid){
  let p=null;
  for(const sec of SEC){ const hit=sec.params.find(x=>x.id===gid); if(hit){p=hit;break;} }
  if(!p) return "";
  const st=getSt(gid); const v=getV(gid);
  return '<tr class="linked"><td class="pid">'+gid+'</td><td class="plabel">'+p.l+' <span class="lk">↗ shared</span></td><td class="punit">'+(p.u||"")+'</td>'
    +'<td class="pval"><div class="cell st-'+st+'"><input type="text" value="'+(v==null?"(no data)":v)+'" disabled></div></td>'
    +'<td class="pstat"><span class="chip '+st+'">'+STLBL[st]+'</span></td><td class="pact"></td></tr>';
}

/* ---------------- glazing engine (ported from NCC xlsx) ---------------- */
function gzZone(){ return parseInt(getV("G3"))||0; }
function gzZoneLookup(){ if(!gzZone()) return null; return (gzZone()===5 && String(getV("GZ5")||"").toLowerCase()==="yes, full brick house") ? "5 BC" : String(gzZone()); }
function gzZcol(){ const zl=gzZoneLookup(); return zl? GD.ZoneCol[zl]:0; }
function gzN(k){ const v=parseFloat(getV(k)); return isFinite(v)?v:0; }

/* Floor areas for the glazing calculation. GZ1 (slab / direct contact),
   GZ2 (ground suspended) and GZ3 (suspended upper) split the conditioned
   floor area G10 by construction. Where the split has not been made, the
   whole of G10 less any suspended areas is taken as slab — reported through
   .derived so the calcs can say so instead of quietly assuming. */
function gzAreas(){
  const b=gzN("GZ2"), u=gzN("GZ3");
  let a=gzN("GZ1"), derived=false;
  if(!(a>0)){
    const tot=gzN("G10");
    if(tot>0){ a=Math.max(0, tot-b-u); derived=(a>0); }
  }
  return {a:a, b:b, u:u, derived:derived, all:a+b+u};
}
function gzAreaNote(){
  const ar=gzAreas();
  return ar.derived
    ? "\nFloor area: GZ1 was blank, so the slab / direct-contact area is taken as G10 − GZ2 − GZ3 = "
      +ar.a.toFixed(1)+" m². Split GZ1–GZ3 explicitly if the dwelling is not slab-on-ground."
    : "";
}
function gzAreaAll(){ return gzAreas().all; }
function gzSlabTimb(){ const _a=gzAreas(), a=_a.a, b=_a.b; if(a+b<=0) return null; return a/(a+b)>=0.5?"Slab":"Timber"; }
function gzAirM(){ return getV("GZ4")==="High"?2:1; }
function gzConstants(){
  const zc=gzZcol(); if(!zc) return null; const j=zc-1, m=gzAirM();
  function pick(stdT,hiT){ const cuS=stdT[0][j], shS=stdT[1][j]; let cuH=hiT[0][j], shH=hiT[1][j];
    if(cuH==null)cuH=cuS; if(shH==null)shH=shS; return {cu:cuS+(m-1)*(cuH-cuS), sh:shS+(m-1)*(shH-shS)}; }
  const A=pick(GD.ConstA_std,GD.ConstA_high), B=pick(GD.ConstB_std,GD.ConstB_high);
  const _ar=gzAreas(), a=_ar.a, b=_ar.b; if(a+b<=0) return null;
  const wa=a/(a+b), wb=b/(a+b);
  return {cu:wa*A.cu+wb*B.cu, sh:wa*A.sh+wb*B.sh};
}
function gzAllow(){
  const c=gzConstants(); if(!c) return null;
  return { cond:Math.round(c.cu*(gzZone()===1?gzAreaAll():1)*10)/10, shg:Math.round(c.sh*gzAreaAll()*10)/10 };
}
function gzFcol(t){ const zl=gzZoneLookup(); return t[0].findIndex(x=>String(x)===String(zl)); }
function gzFS(row){ const t=gzSlabTimb()==="Slab"?GD.S_Slab:GD.S_Timb; const v=t[row-1]&&t[row-1][gzFcol(t)]; return v==null?1:v; }
function gzFW(row){ const t=gzSlabTimb()==="Slab"?GD.W_Slab:GD.W_Timb; const v=t[row-1]&&t[row-1][gzFcol(t)]; return v==null?1:v; }
function gzOC(orient){ const t=gzSlabTimb()==="Slab"?GD.OC_Slab:GD.OC_Timb; const num=GD.OrientNum[orient]; if(!num) return 0;
  const col=t[0].findIndex(x=>x===num); const row=t[gzZcol()]; return (row&&row[col]!=null)?row[col]:0; }
function gzExp(kind,orient,ph){
  const blocks=(kind==="S")?(gzSlabTimb()==="Slab"?GD.ExpS_Slab:GD.ExpS_Timb):(gzSlabTimb()==="Slab"?GD.ExpW_Slab:GD.ExpW_Timb);
  const blk=blocks[gzZcol()-1]; if(!blk) return 0;
  const col=GD.Directions.indexOf(orient); if(col<0) return 0;
  const P=GD.Projections; let idx=0; for(let i=0;i<P.length;i++){ if(ph>=P[i]) idx=i; }
  const lo=P[idx], hi=(lo>=2)?2:P[Math.min(idx+1,P.length-1)];
  const Elo=blk[idx][col], Ehi=(lo>=2)?Elo:blk[Math.min(idx+1,P.length-1)][col];
  const frac=(hi-lo)>0?(ph-lo)/(hi-lo):0;
  return Elo-(Elo-Ehi)*frac;
}
function gzRow(uid){
  const g=f=>getV("c.gl."+uid+"."+f);
  const out={ok:false,uid};
  if(!g("sector")) return out;
  const H=parseFloat(g("h"))||0, W=parseFloat(g("w"))||0, I=parseFloat(g("area"))||0;
  const V=Math.max(H*W,I); if(V<=0) return out;
  const P=parseFloat(g("p"))||0, SH=parseFloat(g("sh"))||0;
  const k=(H>0&&SH-H>0.5)?0.5:1;
  const phys=(P>0&&SH>0)?k*P/SH:0;
  const phW=Math.min(phys,2), phS=(g("dev")==="device")?2:phW;
  const room=g("room")||"Other", level=g("level")||"", frame=g("frame")||"", cover=g("cover")||"";
  let sig=1;
  if(room!=="Other") sig*=gzFS(2);
  if(level==="Upper") sig*=gzFS(3);
  if(frame==="Dark") sig*=gzFS(4); else if(frame==="Medium") sig*=gzFS(5); else if(frame==="Light") sig*=gzFS(6);
  const hard = gzSlabTimb()==="Slab" && level==="Ground: Direct" && room!=="Utility" && GD.HardFloor[cover]==="Hard";
  if(hard) sig*=gzFS(7);
  let om=1;
  if(room!=="Other"){ om*=gzFW(2); om*=gzFW(5); }
  if(level==="Upper") om*=gzFW(3);
  if(frame==="Dark") om*=gzFW(6); else if(frame==="Medium") om*=gzFW(7); else if(frame==="Light") om*=gzFW(8);
  if(hard) om*=gzFW(9);
  let kap=gzOC(g("sector"));
  if(room!=="Other"){ kap*=gzFW(4); kap*=gzFW(2); }
  if(level==="Upper") kap*=gzFW(3);
  const Es=gzExp("S",g("sector"),phS), Ew=gzExp("W",g("sector"),phW);
  return {ok:true,uid,V,Kc:V*kap,Wc:V*Ew*om,Sc:V*Es*sig,
          u:parseFloat(g("u"))||0, shgc:parseFloat(g("shgc"))||0, open:g("open")||""};
}
/* The required specification the optimiser last produced, keyed by opening
   type, so it can be evaluated without touching the proposed windows. */
function gzRequiredMap(){
  const m={};
  for(const k of Object.keys(S.vals)){
    const p=k.match(/^GZR\.(.+)\.(u|shgc)$/); if(!p) continue;
    (m[p[1]]=m[p[1]]||{})[p[2]]=Number(S.vals[k].v);
  }
  return Object.keys(m).length? m : null;
}
function gzHasProposed(){
  for(const uid of (S.coll.gl||[])){
    if(Number(getV("c.gl."+uid+".u"))>0 && Number(getV("c.gl."+uid+".shgc"))>0) return true;
  }
  return false;
}
function gzEval(byType){
  const alw=gzAllow(); if(!alw) return {err:"Enter the climate zone (G3), and either the total conditioned floor area (G10) or the glazing floor-area split (GZ1–GZ3), before calculating."};
  const agg={cond:0,wgain:0,sgain:0}; let rows=0, incomplete=0;
  for(const uid of S.coll.gl){
    const e=gzRow(uid); if(!e.ok) continue;
    rows++;
    const spec = byType ? (byType[e.open]||null) : {u:e.u, shgc:e.shgc};
    if(!spec || !(spec.u>0) || !(spec.shgc>0)){ incomplete++; continue; }
    const sh=Math.min(spec.shgc,0.7);
    agg.cond+=e.Kc*spec.u; agg.wgain+=e.Wc*sh; agg.sgain+=e.Sc*sh;
  }
  if(!rows) return {err:"No valid glazing rows (need sector + size)."};
  const z=gzZone();
  return { agg, alw, incomplete, rows:rows, counted:rows-incomplete, areas:gzAreas(),
    winter: z>=2 ? {ratio: agg.wgain>0?agg.cond/agg.wgain:Infinity, limit:alw.cond, pass: agg.wgain>0&&agg.cond/agg.wgain<=alw.cond} : null,
    summer: z<=7 ? {load:agg.sgain, limit:alw.shg, pass:agg.sgain<=alw.shg} : null };
}

/* ---------------- calc functions (wired to calc rows) ---------------- */
window.__gzLast=null;

/* ==========================================================================
   gzReport() — the single structured result the report generator consumes.
   Recomputed from S.vals on every call: there is no stored glazing outcome
   that can survive an edit to the schedule and quietly go stale.
   ========================================================================== */
function gzReport(){
  if(typeof isNA==="function" && isNA("GZ"))
    return {applicable:false, reason:(typeof naReason==="function" && naReason("GZ")) || "marked not applicable"};
  const r=gzEval();
  if(r.err) return {applicable:true, blocked:r.err};

  /* group the specified openings into a specification table: one line per
     distinct product, which is what the report's glazing schedule wants */
  const byType={}, sched=[];
  for(const uid of (S.coll.gl||[])){
    const e=gzRow(uid); if(!e.ok) continue;
    const g=f=>getV("c.gl."+uid+"."+f);
    const tag=g("tag")||uid.slice(0,4);
    sched.push({tag:tag, sector:g("sector")||"", open:e.open||"", room:g("room")||"",
                area:Math.round(e.V*100)/100, u:e.u>0?e.u:null, shgc:e.shgc>0?e.shgc:null,
                device:g("dev")==="device",
                st:{u:getSt("c.gl."+uid+".u"), shgc:getSt("c.gl."+uid+".shgc")}});
    if(!(e.u>0&&e.shgc>0)) continue;
    const k=(e.open||"(unspecified)")+"|"+e.u+"|"+e.shgc;
    (byType[k]=byType[k]||{type:e.open||"(unspecified)", u:e.u, shgc:e.shgc, tags:[], area:0});
    byType[k].tags.push(tag); byType[k].area+=e.V;
  }

  const pick=(typeof window!=="undefined" && window.__gzSpec && window.__gzSpec.pick) || null;
  const out={
    applicable:true, zone:gzZone(), areas:r.areas, derivedArea:r.areas.derived,
    openings:r.rows, specified:r.counted, incomplete:r.incomplete,
    glazedArea:Math.round(sched.reduce((s,x)=>s+x.area,0)*100)/100,
    winter:null, summer:null,
    spec:Object.keys(byType).map(k=>byType[k]).sort((a,b)=>b.area-a.area),
    schedule:sched,
    products: pick ? Object.keys(pick).map(g=>({type:g, id:pick[g].id, glazing:pick[g].glz,
                                                frame:pick[g].mat, u:pick[g].u, shgc:pick[g].shgc})) : [],
    frameFilter:String(getV("GZ6")||"Any"),
    required: gzRequiredMap(),          /* what the glazing must achieve */
    proposedEntered: gzHasProposed()    /* whether anything has been chosen yet */
  };
  if(r.winter) out.winter={figure:Math.round(r.winter.ratio*1000)/1000, allowance:r.winter.limit,
      pass:r.winter.pass, headroom:Math.round((r.winter.limit-r.winter.ratio)*1000)/1000,
      pct:r.winter.limit>0? Math.round((1-r.winter.ratio/r.winter.limit)*1000)/10 : null,
      cond:Math.round(r.agg.cond*10)/10, gain:Math.round(r.agg.wgain*10)/10};
  else out.winterNote="Climate zone 1 — 13.3.2 sets no winter requirement.";
  if(r.summer) out.summer={figure:Math.round(r.summer.load*100)/100, allowance:r.summer.limit,
      pass:r.summer.pass, headroom:Math.round((r.summer.limit-r.summer.load)*100)/100,
      pct:r.summer.limit>0? Math.round((1-r.summer.load/r.summer.limit)*1000)/10 : null};
  else out.summerNote="Climate zone 8 — 13.3.3 sets no summer requirement.";
  out.complies = (!out.winter || out.winter.pass) && (!out.summer || out.summer.pass) && out.incomplete===0;
  return out;
}

CALC.calc_gzWinter = function(){
  if(isNA("GZP")) return {v:"n/a",cls:"ok",note:"Proposed glazing not yet specified"+(naReason("GZP")?" — "+naReason("GZP"):".")};
  if(!gzHasProposed()) return {v:"",cls:"err",note:"No opening in the schedule carries both a U-Value and an SHGC yet. Enter the proposed windows, or mark this section not applicable until they are chosen. The REQUIRED specification is produced separately, above."};
  const r=gzEval(); if(r.err) return {v:"",cls:"err",note:r.err};
  window.__gzLast=r; setTimeout(drawGzCharts,50);
  if(!r.winter) return {v:"n/a",cls:"ok",note:"Climate zone 1 — 13.3.2 sets no winter requirement. Only the summer test at 13.3.3 applies."};
  if(r.counted===0) return {v:"",cls:"err",note:"No opening carries both a U-Value and an SHGC yet, so there is nothing to test. Run the WERS optimiser (C_GZ3), or enter the specified values, first."+gzAreaNote()};

  const inc=r.incomplete?("\n"+r.incomplete+" row(s) missing U/SHGC — excluded."):"";
  return {v:(r.winter.pass?"PASS ":"FAIL ")+ (isFinite(r.winter.ratio)?r.winter.ratio.toFixed(2):"∞")+" / "+r.winter.limit.toFixed(1),
          cls:r.winter.pass?"ok":"err",
          note:"WINTER — 13.3.2. Aggregate conductance ÷ aggregate winter solar gain = Σcond "+r.agg.cond.toFixed(1)+" ÷ Σwinter gain "+r.agg.wgain.toFixed(1)+" = "+r.winter.ratio.toFixed(3)+", against an allowance of "+r.winter.limit.toFixed(1)+".\n"+(r.winter.pass? "Complies, with "+(r.winter.limit-r.winter.ratio).toFixed(2)+" of headroom." : "Exceeds by "+(r.winter.ratio-r.winter.limit).toFixed(2)+". Levers: lower-U glazing, more north-facing glass, or less shading to north windows.")+inc+gzAreaNote()};
};
CALC.calc_gzSummer = function(){
  if(isNA("GZP")) return {v:"n/a",cls:"ok",note:"Proposed glazing not yet specified"+(naReason("GZP")?" — "+naReason("GZP"):".")};
  if(!gzHasProposed()) return {v:"",cls:"err",note:"No opening in the schedule carries both a U-Value and an SHGC yet. Enter the proposed windows, or mark this section not applicable until they are chosen."};
  const r=gzEval(); if(r.err) return {v:"",cls:"err",note:r.err};
  window.__gzLast=r; setTimeout(drawGzCharts,50);
  if(!r.summer) return {v:"n/a",cls:"ok",note:"Climate zone 8 — 13.3.3 sets no summer requirement. Only the winter test at 13.3.2 applies."};
  if(r.counted===0) return {v:"",cls:"err",note:"No opening carries both a U-Value and an SHGC yet, so there is nothing to test. Run the WERS optimiser (C_GZ3), or enter the specified values, first."+gzAreaNote()};

  const inc=r.incomplete?("\n"+r.incomplete+" row(s) missing U/SHGC — excluded."):"";
  return {v:(r.summer.pass?"PASS ":"FAIL ")+r.summer.load.toFixed(2)+" / "+r.summer.limit.toFixed(1),
          cls:r.summer.pass?"ok":"err",
          note:"SUMMER — 13.3.3. Aggregate solar heat gain ΣA·SHGC·Es·σ = "+r.summer.load.toFixed(2)+" against an allowance of "+r.summer.limit.toFixed(1)+" (CSHGC × "+gzAreaAll().toFixed(1)+" m² floor area).\n"+(r.summer.pass? "Complies, with "+(r.summer.limit-r.summer.load).toFixed(2)+" of headroom ("+((1-r.summer.load/r.summer.limit)*100).toFixed(1)+"% below the limit)." : "Exceeds by "+(r.summer.load-r.summer.limit).toFixed(2)+". Levers: eaves or external shading devices to east and west, lower SHGC on the hot orientations, or less glazed area.")+"\nSHGC is capped at 0.70 for this calculation, as in the ABCB calculator."+inc+gzAreaNote()};
};
const GZ_OPMAP={ "Fixed":["Fixed Window","Window Wall"],"Awning":["Awning Window"],"Casement":["Casement Window"],
  "Double Hung":["Double Hung Window"],"Highly Openable":["Louvre Window","Casement Window","Awning Window"],
  "Louvre":["Louvre Window"],"Sliding":["Sliding Window"],"Sliding Door":["Sliding Door","Bifold Door","Hinged Door"] };
CALC.calc_gzOptimise = function(){
  const alw=gzAllow(); if(!alw||!gzZone()) return {v:"",cls:"err",note:"Enter climate zone (G3) + floor areas (GZ1–GZ3) first."};
  const groups={}, locked={cond:0,wgain:0,sgain:0}, lockedRows=[]; let any=false, missing=[];
  for(const uid of S.coll.gl){
    const e=gzRow(uid); if(!e.ok) continue; any=true;
    /* every opening is optimised: this is the required specification, and
       what happens to be drawn must not constrain it */
    if(!e.open){ missing.push(getV("c.gl."+uid+".tag")||uid); continue; }
    (groups[e.open]=groups[e.open]||{uids:[],K:0,W:0,Sg:0,A:0});
    const g=groups[e.open]; g.uids.push(uid); g.K+=e.Kc; g.W+=e.Wc; g.Sg+=e.Sc; g.A+=e.V;
  }
  if(!any) return {v:"",cls:"err",note:"No valid glazing rows."};
  if(missing.length) return {v:"",cls:"err",note:"Openability missing on: "+missing.join(", ")};
  const gkeys=Object.keys(groups);
  if(!gkeys.length) return {v:"all manual",cls:"ok",note:"Every row holds a manual (purple) or documented spec — nothing to optimise. Run the winter/summer checks instead."};
  const _fm=String(getV("GZ6")||"Any"), _anyFm=(_fm==="Any"||!_fm), _fmMissed=[];
  const cands={};
  for(const g of gkeys){
    const ops=GZ_OPMAP[g]||[]; const seen=new Set(); const list=[];
    for(const w of GD.WERS){ if(!ops.includes(w.op)||w.shgc>0.7) continue;
      if(!_anyFm && w.mat!==_fm) continue;
      const key=w.u.toFixed(2)+"/"+w.shgc.toFixed(2); if(seen.has(key)) continue; seen.add(key); list.push(w); }
    if(!list.length && !_anyFm){
      _fmMissed.push(g);
      for(const w of GD.WERS){ if(!ops.includes(w.op)||w.shgc>0.7) continue;
        const key=w.u.toFixed(2)+"/"+w.shgc.toFixed(2); if(seen.has(key)) continue; seen.add(key); list.push(w); }
    }
    if(!list.length) return {v:"",cls:"err",note:"No WERS product serves opening type '"+g+"'. Check the openability against the product families in GZ_OPMAP."};
    list.sort((a,b)=>b.u-a.u||a.shgc-b.shgc);
    cands[g]=list.length>90? list.filter((_,i)=>i%Math.ceil(list.length/90)===0).concat(list.slice(0,10)) : list;
  }
  const z=gzZone();
  const Ls=z<=7?alw.shg:Infinity, Lw=z>=2?alw.cond:Infinity;
  const order=gkeys.sort((a,b)=>groups[b].A-groups[a].A);
  const minAfter=i=>{ let s=0; for(let j=i+1;j<order.length;j++) s+=groups[order[j]].Sg*Math.min(...cands[order[j]].map(c=>c.shgc)); return s; };
  /* Winter reads as a ratio KU/WS ≤ Lw, i.e. the margin M = KU − Lw·WS must
     finish at or below zero. Tracking M lets the search look ahead on winter
     the same way minAfter() already looks ahead on summer. */
  const mStep=(G,c)=> G.K*c.u - (Lw===Infinity?0:Lw*G.W*Math.min(c.shgc,0.7));
  const minMAfter=i=>{ let s=0; for(let j=i+1;j<order.length;j++){
      const G=groups[order[j]]; s+=Math.min.apply(null,cands[order[j]].map(c=>mStep(G,c))); } return s; };
  const M0=locked.cond-(Lw===Infinity?0:Lw*locked.wgain);
  let beam=[{KU:locked.cond,WS:locked.wgain,SS:locked.sgain,AU:0,M:M0,pick:{}}];
  let died="";
  for(let gi=0;gi<order.length;gi++){
    const g=order[gi], G=groups[g], next=[];
    let cutS=0, cutW=0;
    for(const stt of beam) for(const c of cands[g]){
      const SS=stt.SS+G.Sg*Math.min(c.shgc,0.7);
      if(SS+minAfter(gi)>Ls+1e-9){ cutS++; continue; }
      const M=stt.M+mStep(G,c);
      if(Lw!==Infinity && M+minMAfter(gi)>1e-9){ cutW++; continue; }
      next.push({KU:stt.KU+G.K*c.u, WS:stt.WS+G.W*Math.min(c.shgc,0.7), SS, M,
                 AU:stt.AU+G.A*c.u, pick:Object.assign({},stt.pick,{[g]:c})});
    }
    if(!next.length){
      died = (cutW && !cutS)
        ? "The winter allowance (13.3.2) cannot be met by any WERS combination with the current orientations and shading. Levers: reduce shading to north glazing, move glazed area to the north, or accept lower-U (better performing) products than the library holds."
        : (cutS && !cutW)
        ? "The summer allowance (13.3.3) cannot be met by any WERS combination with the current shading and orientations. Levers: eaves or external shading devices to east and west, or less glazed area."
        : "Neither allowance can be met together with the current orientations and shading. Winter wants high SHGC and low U; summer wants low SHGC. Shading is what separates them — add external devices to east and west, and keep north glazing unshaded in winter.";
      break;
    }
    /* keep the cheapest (highest average U), but reserve a quarter of the beam
       for the states closest to winter feasibility so they are not crowded out */
    next.sort((a,b)=>b.AU-a.AU);
    const keep=next.slice(0,300), seenP=new Set(keep);
    next.slice().sort((a,b)=>a.M-b.M).forEach(s=>{ if(keep.length<400 && !seenP.has(s)){ keep.push(s); seenP.add(s); } });
    beam=keep;
  }
  if(died) return {v:"no compliant combination",cls:"err",note:died
    +(lockedRows.length? "\nRows held at their confirmed specification and excluded from the search: "+lockedRows.length : "")};
  const feas=beam.filter(s=>Lw===Infinity||(s.WS>0&&s.KU/s.WS<=Lw+1e-9));
  const sol=feas.length?feas[0]:beam.reduce((a,b)=>(a.KU/Math.max(a.WS,1e-9)<b.KU/Math.max(b.WS,1e-9)?a:b));
  /* REQUIRED spec, stored per opening type under its own keys. It must not
     land in the schedule: those cells are the PROPOSED windows, and the
     compliance section reads them. Overwriting them made the check grade
     the optimiser's own answer, so it could never fail. */
  for(const k of Object.keys(S.vals)) if(k.indexOf("GZR.")===0) dropV(k);
  for(const [g,c] of Object.entries(sol.pick)){
    setV("GZR."+g+".u", c.u, "calc");
    setV("GZR."+g+".shgc", c.shgc, "calc");
    setV("GZR."+g+".id", c.id, "calc");
  }
  window.__gzSpec={pick:sol.pick, groups, lockedRows, feasible:feas.length>0};
  const r=gzEval(gzRequiredMap()); window.__gzLast=r; setTimeout(()=>{drawGzCharts();},80);
  const desc=Object.entries(sol.pick).map(([g,c])=>g+": "+c.id+" (U "+c.u.toFixed(1)+" / SHGC "+c.shgc.toFixed(2)+")").join("\n");
  if(!feas.length) return {v:"closest (infeasible)",cls:"err",
    note:"No WERS combination passes BOTH tests with the current shading and orientations. The closest has been written in for reference:\n"+desc+(lockedRows.length? "\nRows held at their confirmed specification: "+lockedRows.length : "")+(_fmMissed.length? "\nNo "+_fm+" product serves "+_fmMissed.join(", ")+" — any frame was used for those." : "")+"\nLevers: reduce shading to north glazing (winter), add external devices east and west (summer), or specify lower-U products."};
  return {v:"required spec — see below",cls:"ok",
    note:"Highest average U-Value — so the least expensive glazing — that still satisfies both tests. One product per opening type:\n"+desc+(lockedRows.length?"\nRows held at their confirmed specification and excluded from the search: "+lockedRows.length:"")+(_fmMissed.length? "\nNo "+_fm+" product serves "+_fmMissed.join(", ")+" — any frame was used for those." : "")+"\nWinter "+(r.winter?(r.winter.ratio.toFixed(2)+" ≤ "+r.winter.limit.toFixed(1)):"n/a")+" | Summer "+(r.summer?(r.summer.load.toFixed(2)+" ≤ "+r.summer.limit.toFixed(1)):"n/a")};
};

/* ---------------- charts + shared-data panel injected into section 6 ---------------- */
function drawGzBar(cv,title,items){
  if(!cv) return; const ctx=cv.getContext("2d"); ctx.clearRect(0,0,cv.width,cv.height);
  ctx.fillStyle="#1f2937"; ctx.font="bold 13px Segoe UI"; ctx.fillText(title,14,22);
  if(!items.length){ ctx.fillStyle="#6b7280"; ctx.font="12px Segoe UI"; ctx.fillText("not required in this climate zone",14,60); return; }
  const max=Math.max(...items.map(i=>i.v),0.001)*1.15;
  items.forEach((it,i)=>{
    const x=70+i*((cv.width-110)/items.length), bw=Math.min(110,(cv.width-110)/items.length-40);
    const hpx=(it.v/max)*(cv.height-100), y=cv.height-45-hpx;
    ctx.fillStyle=it.c; ctx.fillRect(x,y,bw,hpx);
    ctx.fillStyle="#1f2937"; ctx.font="11px Segoe UI"; ctx.fillText(it.l,x,cv.height-26);
    ctx.font="bold 12px Segoe UI"; ctx.fillText(it.v.toFixed(2),x,y-6);
  });
  ctx.strokeStyle="#e5e7eb"; ctx.beginPath(); ctx.moveTo(50,cv.height-45); ctx.lineTo(cv.width-16,cv.height-45); ctx.stroke();
}
function drawGzCharts(){
  const r=window.__gzLast; if(!r||r.err) return;
  drawGzBar(document.getElementById("gzChS"),"Summer — SHGC load vs max allowance (13.3.3)",
    r.summer?[{l:"Outcome",v:r.summer.load,c:r.summer.pass?"#16a34a":"#dc2626"},{l:"Max allowance",v:r.summer.limit,c:"#94a3b8"}]:[]);
  drawGzBar(document.getElementById("gzChW"),"Winter — CU/CSHGC vs max allowance (13.3.2)",
    r.winter?[{l:"Outcome",v:isFinite(r.winter.ratio)?r.winter.ratio:0,c:r.winter.pass?"#16a34a":"#dc2626"},{l:"Max allowance",v:r.winter.limit,c:"#94a3b8"}]:[]);
}
function gzSharedPanel(){
  const rows=[];
  function add(flag,msg){ rows.push('<div style="font-size:11.5px;padding:2px 0;color:'+(flag==="ok"?"#16a34a":flag==="warn"?"#b45309":"#6b7280")+'">'+(flag==="ok"?"✓ ":"⚠ ")+msg+'</div>'); }
  const z=getV("G3");
  add(z?"ok":"warn","Climate zone: single source G3 ("+(z||"no data")+") — feeds 13.2, 13.4, 13.5, 13.6, 13.7 and this calculator.");
  const g10=parseFloat(getV("G10"))||0, sum=gzAreaAll();
  if(g10&&sum) add(Math.abs(g10-sum)/g10<0.02?"ok":"warn","Floor areas: GZ1+GZ2+GZ3 = "+sum.toFixed(1)+" m² vs G10 total "+g10.toFixed(1)+" m²"+(Math.abs(g10-sum)/g10<0.02?" — reconciled.":" — MISMATCH, reconcile before calculating."));
  else add("warn","Floor areas: enter GZ1–GZ3 (split of G10 by floor construction). G10 = "+(g10||"no data")+".");
  const f1=getV("F1");
  if(f1==="slab-on-ground" && gzN("GZ2")>0) add("warn","F1 says slab-on-ground but GZ2 (ground suspended) > 0 — check.");
  else if(f1) add("ok","Floor type F1 ("+f1+") consistent with GZ1/GZ2 split.");
  if(z==="5"){ const cav=S.coll.walls.some(uid=>getV("c.walls."+uid+".constr")==="masonry cavity");
    if(cav && String(getV("GZ5")||"").toLowerCase()!=="yes, full brick house") add("warn","CZ5 + a masonry-cavity external wall type: consider GZ5 'full brick house' (affects constants — 5 BC column).");
    else add("ok","CZ5 brick-cavity question GZ5 = "+(getV("GZ5")||"No")+" (wall types: "+(S.coll.walls.map(uid=>getV("c.walls."+uid+".code")||"?").join(", ")||"none")+")."); }
  add("ok","Storeys: shared G9 — per-window levels set in the schedule (Level/floor column).");
  add("ok","Retired to avoid double-up: old GL10 frame-SA band → per-window Frame colour; old GL12 vent % → Openability column + GZ4 Air movement.");
  return '<div style="border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin:10px 0;background:#f8fafc"><b style="font-size:11px;text-transform:uppercase;color:#6b7280">Shared data cross-checks</b>'+rows.join("")+'</div>';
}
function injectGzExtras(){
  const body=document.querySelector("#sec-GZ .sec-body"); if(!body) return;
  const d=document.createElement("div"); d.id="gzExtras";
  d.innerHTML=gzSharedPanel()
    +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px">'
    +'<canvas id="gzChS" width="560" height="290" style="background:#fff;border:1px solid var(--line);border-radius:8px;max-width:100%"></canvas>'
    +'<canvas id="gzChW" width="560" height="290" style="background:#fff;border:1px solid var(--line);border-radius:8px;max-width:100%"></canvas></div>';
  body.appendChild(d);
  drawGzCharts();
}
const __origRender = render;
render = function(){ __origRender(); injectGzExtras(); };
p13Render();

</script>
<script>
/* ==================== SUITE SHELL ==================== */
/* build stamp — compare this between devices before blaming the sync */
const SUITE_BUILD = "2026-08-03 10:47";
const SUITE_BUILD_NOTE = " · build " + SUITE_BUILD;
/* ============================================================================
   SUITE SHELL — owns the store, the project selector, the two-level nav, and
   the single Drive file.

   One project record now carries BOTH halves:
       { id, job, client, fee, log[], …          ← tracker fields
         updatedAt                                ← stamps the tracker fields
         p13: { vals, coll, seq, eePack,
                updatedAt } }                     ← stamps the Part 13 data

   The two halves stamp independently, so editing fees on the desktop while
   entering H6 data on the iPad merges cleanly instead of one overwriting the
   other — which is what the old two-file split gave us for free and what a
   naive merge would have thrown away.
   ========================================================================== */
"use strict";

const SUITE_KEY = "section_h_suite_v1";

function blankP13(){
  return {vals:{},coll:{rl:[],gl:[],rooms:[],lts:[],walls:[]},seq:1,page:"project",eePack:null};
}

const SUITE = {
  side: "business",

  /* ---------- store ---------- */
  p13Of(p){
    if(!p) return null;
    if(!p.p13){ p.p13=blankP13(); p.p13.__fresh=true; }
    return p.p13;
  },

  /* Carry the tracker's key fields across to the compliance side. Only fills
     blanks, so it can never overwrite something typed against a drawing.
     The job number is the exception — the tracker owns it outright, so G0
     mirrors it rather than being separately editable in two places. */
  seed(p, force){
    if(!p) return;
    const b=SUITE.p13Of(p);
    const fresh=b.__fresh; delete b.__fresh;
    if(!(fresh||force)) { SUITE.syncJob(p); return; }
    const put=(k,v)=>{ if(v!=null&&v!==""&&(!b.vals[k]||b.vals[k].v===""||b.vals[k].v==null)) b.vals[k]={v:String(v),st:"assum"}; };
    put("G1",p.addr); put("G0a",p.client); put("G0b",p.designer); put("G0d",p.dwell);
    if(p.type==="NatHERS") put("G8","NatHERS + WoH");
    if(p.type==="Part H6") put("G8","Elemental DtS");
    SUITE.syncJob(p);
  },
  syncJob(p){
    if(!p) return;
    const b=SUITE.p13Of(p), job=String(p.job||"").trim();
    const cur=(b.vals.G0&&b.vals.G0.v)||"";
    if(job && cur!==job) b.vals.G0={v:job,st:"conf"};
    else if(!job && cur) delete b.vals.G0;
  },

  bind(){
    const p=curProj();
    if(p){ SUITE.seed(p,false); p13Bind(SUITE.p13Of(p)); }
    else p13Bind(blankP13());
  },
  saveP13(){
    const p=curProj();
    if(p){ SUITE.p13Of(p).updatedAt=new Date().toISOString(); }
    save();                                   /* one store, one autosave */
    const el=document.getElementById("savenote");
    if(el) el.textContent="saved "+new Date().toLocaleTimeString();
  },
  replaceP13(block){
    const p=curProj(); if(!p) return;
    p.p13=block; p.p13.updatedAt=new Date().toISOString();
    SUITE.bind();
  },

  /* ---------- navigation ---------- */
  go(side,page){
    SUITE.side = (side==="compliance") ? "compliance" : "business";
    if(page){ if(SUITE.side==="business") T.page=page; else S.page=page; }
    T.side=SUITE.side; save(); SUITE.paint();
  },
  paint(){
    const biz = SUITE.side==="business";
    document.querySelectorAll("#topnav button[data-side]").forEach(b=>{
      b.classList.toggle("active", b.dataset.side===SUITE.side);
    });
    document.getElementById("trkRoot").classList.toggle("suite-hide", !biz);
    document.getElementById("p13Root").classList.toggle("suite-hide", biz);
    document.getElementById("pagenav").classList.toggle("suite-hide", !biz);
    document.getElementById("p13nav").classList.toggle("suite-hide", biz);
    document.getElementById("counts").classList.toggle("suite-hide", !biz);
    document.getElementById("p13counts").classList.toggle("suite-hide", biz);
    document.getElementById("p13tools").classList.toggle("suite-hide", biz);
    /* the project picker belongs to the Project Data side only — on Project
       Admin you choose a project from the Roster, as before */
    if(!biz) SUITE.paintPicker();
    if(biz) render(); else { SUITE.bind(); p13Render(); }
    SUITE.foot();
  },
  foot(){
    const el=document.getElementById("suiteFoot"); if(!el) return;
    el.innerHTML = SUITE.side==="business"
      ? "Fees ex-GST unless marked · GST 10% · $/hr counts paid invoices only" + SUITE_BUILD_NOTE
      : "NCC 2022 Amd 2 · Housing Provisions Part 13 · energy provisions carry into NCC 2025 (check state adoption)" + SUITE_BUILD_NOTE;
  },

  /* ---------- project selector (shared by both sides) ---------- */
  paintPicker(){
    const el=document.getElementById("projPick"); if(!el) return;
    const list=T.projects.slice().sort(byJobNumber ? (a,b)=>byJobNumber({p:a},{p:b}) : ()=>0);
    if(!list.length){
      el.innerHTML='<label>No projects yet</label><button class="addrow" style="background:#374151;color:#fff" onclick="newProject()">+ new project</button>';
      return;
    }
    const cur=T.cur||"";
    el.innerHTML='<label for="suiteProj">Project</label>'
      +'<select id="suiteProj" onchange="SUITE.pick(this.value)">'
      +'<option value="">— none selected —</option>'
      +list.map(p=>'<option value="'+p.id+'"'+(p.id===cur?" selected":"")+'>'
          +suiteEsc((p.job||"(no number)")+(p.addr?" — "+p.addr:""))+'</option>').join("")
      +'</select>';
  },
  pick(id){
    T.cur = id || null;
    save(); SUITE.bind(); SUITE.paint(); window.scrollTo(0,0);
  },

  /* ---------- import / export of the whole suite ---------- */
  exportAll(){
    const blob=new Blob([JSON.stringify(T,null,2)],{type:"application/json"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
    a.download="section_h_suite_"+todayISO()+".json"; a.click();
  },
  importAll(ev){
    const f=ev.target.files[0]; if(!f) return;
    const rd=new FileReader();
    rd.onload=()=>{ try{
      const j=JSON.parse(rd.result);
      if(!j.projects) return alert("Not a Section H Suite file.");
      if(!confirm("Replace everything on this device with the contents of this file?\n\nA snapshot is taken first — you can undo with ↺ in the sync bar.")) return;
      if(window.GSync&&GSync.snapshots) { try{ GSync._t; }catch(e){} }
      T=j; ensureShape(); migrateIds(); baseline(); SUITE.bind(); save(); SUITE.paint();
    }catch(e){ alert("Import failed: "+e.message); } };
    rd.readAsText(f); ev.target.value="";
  }
};
window.SUITE=SUITE;
/* testing seam — `let`/`const` globals aren't reachable from outside the script */
SUITE._t={ get T(){return T}, get S(){return S}, get SEC(){return SEC}, get CALC(){return CALC}, get side(){return SUITE.side} };

function suiteEsc(s){ return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

/* shared CSV helper — the tracker side uses this, the Part 13 side has its own */
function suiteCSV(name, rows){
  const cell=v=>{ v=(v==null?"":String(v)); return /[",\n]/.test(v)? '"'+v.replace(/"/g,'""')+'"' : v; };
  const body=rows.map(r=>r.map(cell).join(",")).join("\r\n");
  const blob=new Blob(["﻿"+body],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download=name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}

/* ============================================================================
   MIGRATION — fold the two old localStorage stores into one
   ========================================================================== */
function suiteMigrate(){
  if(localStorage.getItem(SUITE_KEY)) return false;      /* already migrated */

  let old=null;
  try{ const x=localStorage.getItem("project_tracker_v1"); if(x) old=JSON.parse(x); }catch(e){}
  if(old&&old.projects){ T=old; }
  ensureShape(); migrateIds();

  /* pull in every Part 13 slot, matching on job number */
  const BASE="part13_dts_tool_v2", slots={};
  try{
    for(let i=0;i<localStorage.length;i++){
      const k=localStorage.key(i);
      if(k&&k.indexOf(BASE+"::")===0){
        try{ slots[k.slice(BASE.length+2)]=JSON.parse(localStorage.getItem(k)); }catch(e){}
      }
    }
  }catch(e){}

  const norm=s=>String(s==null?"":s).trim().toLowerCase();
  let attached=0, created=0;
  for(const [name,block] of Object.entries(slots)){
    if(!block) continue;
    let p=T.projects.find(x=>norm(x.job)===norm(name) && norm(name)!=="");
    if(!p && name!=="default"){
      /* a Part 13 job with no tracker record — keep it, don't discard it */
      p={id:uid(), updatedAt:new Date().toISOString(), job:name, addr:"",client:"",designer:"",
         type:"",dwell:"",cx:"",fee:"",pfee:"",adj:"",hold:false,log:[]};
      /* backfill the few fields the data tool already knows */
      const gv=k=>(block.vals&&block.vals[k]&&block.vals[k].v)||"";
      p.addr=gv("G1"); p.client=gv("G0a"); p.designer=gv("G0b"); p.dwell=gv("G0d");
      T.projects.push(p); created++;
    }
    if(p){ p.p13=block; p.p13.updatedAt=p.p13.updatedAt||new Date().toISOString(); attached++; }
  }
  if(!T.cur && T.projects.length) T.cur=T.projects[0].id;
  try{ localStorage.setItem(SUITE_KEY,JSON.stringify({at:new Date().toISOString(),attached:attached,created:created})); }catch(e){}
  if(attached||created){
    setTimeout(()=>{
      alert("Welcome to the merged Section H Suite.\n\n"
        +"Your tracker projects and your Part 13 data are now one record each:\n"
        +"  · "+attached+" Part 13 job"+(attached===1?"":"s")+" attached to a project\n"
        +(created? "  · "+created+" project"+(created===1?"":"s")+" created for Part 13 jobs that had no tracker entry\n":"")
        +"\nThe old files are untouched, so nothing is lost either way.");
    },600);
  }
  return true;
}

/* ============================================================================
   SYNC — one Drive file for the whole suite
   ========================================================================== */

/* ---------------------------------------------------------------------------
   suiteMergeP13 — merge two Part 13 blocks value by value.

   Taking the whole block on a timestamp is what lost Ellie's data: one newer
   block on Drive replaced everything typed here. Each cell now carries its own
   `at` and is decided on its own, exactly the way projects and costs already
   merge one level up.

   A cell written before this build has no `at`; it inherits its block's
   updatedAt, which is the most that can honestly be said about when it was
   written. Ties go to local — the device in front of you is the one whose work
   is unsaved elsewhere.
   ------------------------------------------------------------------------- */
function suiteMergeP13(lp, rp){
  if(!lp) return rp; if(!rp) return lp;
  const T0=s=>GSync.ts(s), lBase=T0(lp.updatedAt), rBase=T0(rp.updatedAt);
  const at=(blk,base,k)=>{ const c=blk.vals&&blk.vals[k]; return c&&c.at? T0(c.at) : base; };

  const out=Object.assign({}, T0(rp.updatedAt)>T0(lp.updatedAt) ? rp : lp);
  out.vals={}; out.coll={}; out.valTombs={}; out.collTombs={};

  /* ---- deletions first: a tombstone only wins if it postdates the value --- */
  const vt=Object.assign({}, lp.valTombs||{}, rp.valTombs||{});
  for(const k of Object.keys(rp.valTombs||{})){
    const l=(lp.valTombs||{})[k];
    if(l && T0(l)>T0(rp.valTombs[k])) vt[k]=l;
  }
  const ct=Object.assign({}, lp.collTombs||{}, rp.collTombs||{});
  for(const k of Object.keys(rp.collTombs||{})){
    const l=(lp.collTombs||{})[k];
    if(l && T0(l)>T0(rp.collTombs[k])) ct[k]=l;
  }

  /* ---- values ------------------------------------------------------------ */
  const keys=new Set([...Object.keys(lp.vals||{}), ...Object.keys(rp.vals||{})]);
  for(const k of keys){
    const lc=(lp.vals||{})[k], rc=(rp.vals||{})[k];
    const lAt=lc? at(lp,lBase,k) : -1, rAt=rc? at(rp,rBase,k) : -1;
    const win = (lc&&rc) ? (rAt>lAt ? rc : lc) : (lc||rc);
    const winAt = (win===rc) ? rAt : lAt;
    if(vt[k] && T0(vt[k])>=winAt) continue;      /* deleted after it was written */
    out.vals[k]=win;
  }

  /* ---- schedule rows: union, minus anything tombstoned, local order first - */
  const cids=new Set([...Object.keys(lp.coll||{}), ...Object.keys(rp.coll||{})]);
  for(const cid of cids){
    const l=(lp.coll||{})[cid]||[], r=(rp.coll||{})[cid]||[];
    const seen=new Set(), rows=[];
    for(const uid of l.concat(r)){
      if(seen.has(uid)) continue; seen.add(uid);
      if(ct[cid+"."+uid]) continue;
      rows.push(uid);
    }
    out.coll[cid]=rows;
  }

  /* ---- tombstones travel, but do not accumulate forever ------------------ */
  const cutoff=Date.now()-180*24*3600*1000;
  for(const k of Object.keys(vt)) if(T0(vt[k])>cutoff) out.valTombs[k]=vt[k];
  for(const k of Object.keys(ct)) if(T0(ct[k])>cutoff) out.collTombs[k]=ct[k];

  out.seq=Math.max(Number(lp.seq)||1, Number(rp.seq)||1);
  out.updatedAt = T0(rp.updatedAt)>T0(lp.updatedAt) ? rp.updatedAt : lp.updatedAt;
  return out;
}

function suiteMergeProjects(localArr, remoteArr, localTombs, remoteTombs){
  /* tracker fields and the p13 block carry separate stamps and merge separately */
  const L={}, R={};
  for(const p of (localArr||[]))  if(p&&p.id!=null) L[p.id]=p;
  for(const p of (remoteArr||[])) if(p&&p.id!=null) R[p.id]=p;
  const base=GSync.mergeMaps(
    Object.fromEntries(Object.entries(L).map(([k,v])=>[k,Object.assign({},v,{p13:undefined})])),
    Object.fromEntries(Object.entries(R).map(([k,v])=>[k,Object.assign({},v,{p13:undefined})])),
    localTombs, remoteTombs);
  const out={};
  for(const [id,rec] of Object.entries(base.map)){
    const lp=L[id]&&L[id].p13, rp=R[id]&&R[id].p13;
    const p13 = (lp&&rp) ? suiteMergeP13(lp,rp) : (lp||rp);
    const merged=Object.assign({},rec);
    if(p13) merged.p13=p13; else delete merged.p13;
    out[id]=merged;
  }
  return {list:Object.keys(out).map(k=>out[k]), tombs:base.tombs};
}

function suiteGsyncInit(){
  if(!window.GSync) return;
  GSync.init({
    app:"suite", fileName:"SectionH_Suite.json",
    device:(navigator.platform||"device"),
    getState:()=>{ stampChanges(); return T; },
    mergeState:st=>{
      if(!st||!st.projects) return false;
      try{
        stampChanges();
        const P=suiteMergeProjects(T.projects, st.projects, T.tombs, st.tombs);
        const C=GSync.mergeMaps(
          Object.fromEntries((T.costs||[]).map(c=>[c.id,c])),
          Object.fromEntries((st.costs||[]).map(c=>[c.id,c])),
          T.tombs, st.tombs);
        const set=GSync.mergeSettings({goal:T.goal,calYM:T.calYM},{goal:st.goal,calYM:st.calYM},T.settingsAt,st.settingsAt);

        /* Word templates and business details live at the top of T, outside
           projects/costs. An earlier version of this merge simply didn't
           mention them, so a template uploaded on one device never reached
           the other AND was wiped off Drive by the other device's next push.
           Templates carry their own `at`, so one uploaded on each device
           both survive; business details merge as one block by `bizAt`. */
        T.templates = GSync.mergeMaps(T.templates||{}, st.templates||{}, {}, {}, "at").map;
        if(st.biz && GSync.ts(st.bizAt) > GSync.ts(T.bizAt)){ T.biz=st.biz; T.bizAt=st.bizAt; }
        else if(st.biz && !T.biz){ T.biz=st.biz; T.bizAt=st.bizAt; }
        const keepCur = T.cur && P.list.some(p=>p.id===T.cur) ? T.cur : null;
        T.projects=P.list;
        T.costs=Object.keys(C.map).map(k=>C.map[k]);
        T.tombs=Object.assign({},P.tombs,C.tombs);
        T.goal=set.goal; T.calYM=set.calYM; T.cur=keepCur;
        T.settingsAt = GSync.ts(st.settingsAt)>GSync.ts(T.settingsAt)? st.settingsAt : T.settingsAt;
        ensureShape();
        try{ localStorage.setItem(STKEY,JSON.stringify(T)); }catch(e){}
        baseline(); SUITE.bind();
      }catch(e){ return false; }
      SUITE.paint();
      return true;
    },
    setState:st=>{
      T=st; ensureShape(); migrateIds();
      try{ localStorage.setItem(STKEY,JSON.stringify(T)); }catch(e){}
      baseline(); SUITE.bind(); SUITE.paint();
    }
  });
}

/* ============================================================================
   BOOT
   ========================================================================== */
(function suiteBoot(){
  load();                      /* tracker store + id migration + baseline */
  suiteMigrate();              /* fold in the old Part 13 slots, once */
  ensureShape();
  SUITE.side = (T.side==="compliance") ? "compliance" : "business";
  SUITE.bind();
  document.querySelectorAll("#topnav button[data-side]").forEach(b=>{
    b.addEventListener("click",()=>SUITE.go(b.dataset.side));
  });
  SUITE.paint();
  save();
  suiteGsyncInit();
  /* a template dropped into the Drive folder by hand should just appear;
     Drive needs a moment to connect first, and this must never block boot */
  setTimeout(()=>{ try{ if(typeof adoptAllTemplates==="function") adoptAllTemplates(); }catch(e){} }, 5000);
})();

</script>
