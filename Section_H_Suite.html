<style>
/* ---- Project Tracker styles ---- */

  :root{
    --red:#dc2626; --red-bg:#fee2e2;
    --blue:#2563eb; --blue-bg:#dbeafe;
    --green:#16a34a; --green-bg:#dcfce7;
    --purple:#7c3aed; --purple-bg:#ede9fe;
    --orange:#ea580c; --orange-bg:#ffedd5;
    --ink:#1f2937; --muted:#6b7280; --line:#e5e7eb; --card:#ffffff; --bg:#f3f4f6;
  }
  *{box-sizing:border-box}
  body{font-family:"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink);margin:0;padding:0 0 80px}
  header{position:sticky;top:0;z-index:50;background:#111827;color:#fff;padding:10px 20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}

  .counts{display:flex;gap:6px;flex-wrap:wrap}
  .pill{border-radius:20px;padding:2px 10px;font-size:11px;font-weight:600;color:#fff}
  .pill.red{background:var(--red)} .pill.blue{background:var(--blue)} .pill.green{background:var(--green)} .pill.purple{background:var(--purple)} .pill.orange{background:var(--orange)} .pill.grey{background:#4b5563}
  header button{background:#374151;color:#fff;border:1px solid #4b5563;border-radius:6px;padding:5px 10px;font-size:12px;cursor:pointer}
  header button:hover{background:#4b5563}
  #pagenav{max-width:1180px;margin:14px auto 0;padding:0 16px;display:flex;gap:8px}

  main{max-width:1180px;margin:18px auto;padding:0 16px}
  section.card{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:18px;overflow:hidden}
  .sec-head{padding:10px 16px;background:#f9fafb;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .sec-head h2{font-size:14px;margin:0;flex:1}
  .sec-body{padding:8px 16px 16px}
  .banner{background:#fef9c3;border:1px solid #fde047;color:#854d0e;font-size:12px;padding:6px 10px;border-radius:6px;margin:8px 0}
  table.grid{width:100%;border-collapse:collapse;font-size:12.5px}
  table.grid th{font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
  table.grid td{padding:5px 6px;border-bottom:1px solid #f1f5f9;vertical-align:middle}
  .cell input,.cell select{width:100%;padding:5px 7px;border-radius:6px;border:1.5px solid var(--line);font-size:12.5px;background:#fff}
  .cell input[disabled]{background:#f3f4f6;color:#374151;font-weight:600}
  .chip{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:10px;white-space:nowrap}
  .chip.ok{background:var(--green-bg);color:var(--green)}
  .chip.warn{background:var(--orange-bg);color:var(--orange)}
  .chip.late{background:var(--red-bg);color:var(--red)}
  .chip.info{background:var(--blue-bg);color:var(--blue)}
  .chip.done{background:#e5e7eb;color:#4b5563}
  .abtn{border:1px solid var(--line);background:#fff;border-radius:6px;padding:3px 8px;font-size:11px;cursor:pointer;margin-right:4px}
  .abtn.confirm{color:var(--green);border-color:var(--green)}
  .abtn.confirm:hover{background:var(--green-bg)}
  .abtn.del{color:var(--red)}
  .abtn.hold{color:var(--orange);border-color:var(--orange)}
  .cbtn{background:var(--orange);color:#fff;border:none;border-radius:6px;padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer}
  .cbtn:hover{filter:brightness(1.1)}
  .addrow{border:1px dashed var(--blue);color:var(--blue);background:#fff;border-radius:6px;padding:4px 10px;font-size:11.5px;cursor:pointer}
  .fee-line{display:flex;justify-content:space-between;font-size:12.5px;padding:4px 2px;border-bottom:1px solid #f1f5f9}
  .fee-line b{font-variant-numeric:tabular-nums}
  .statbox{display:inline-block;vertical-align:top;border:1px solid var(--line);border-radius:8px;padding:10px 16px;margin:6px 10px 6px 0;background:#fff;min-width:215px}
  .statbox .lbl{font-size:11px;text-transform:uppercase;color:var(--muted);letter-spacing:.03em}
  .statbox .val{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
  .statbox .sub{font-size:11px;color:var(--muted)}
  tr.clickable{cursor:pointer}
  tr.clickable:hover td{background:#f8fafc}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}
  .cal .dow{font-size:10.5px;text-transform:uppercase;color:var(--muted);font-weight:700;text-align:center;padding:2px}
  .cal .day{min-height:92px;border:1px solid var(--line);border-radius:6px;padding:4px;font-size:11px;background:#fff;overflow:hidden}
  .cal .day.other{background:#f8fafc}
  .cal .day.today{outline:2px solid var(--blue)}
  .cal .dn{color:var(--muted);font-weight:700;font-size:10.5px}
  .cal .evt{display:block;margin:2px 0;padding:2px 4px;border-radius:4px;background:var(--blue-bg);color:var(--blue);cursor:pointer;font-size:10px;line-height:1.25;border:none;text-align:left;width:100%}
  .cal .evt.pay{background:var(--green-bg);color:var(--green);font-weight:700}
  .cal .evt.late{background:var(--red-bg);color:var(--red)}
  footer{position:fixed;bottom:0;left:0;right:0;background:#111827;color:#9ca3af;font-size:11px;padding:6px 20px;display:flex;justify-content:space-between}

<body>
<header>
  <h1>Studio Bun — Admin <span style="font-weight:400;color:#9ca3af">Project Tracker and Data · FY <span id="fyLbl"></span></span></h1>
  <div class="counts" id="counts"></div>
  <div class="counts" id="p13counts"></div>
  <button onclick="SUITE.exportAll()">Export JSON</button>
  <button onclick="document.getElementById('importFile').click()">Import</button>
  <input type="file" id="importFile" accept=".json" style="display:none" onchange="SUITE.importAll(event)">
  <span id="p13tools" class="suite-hide">
    <button onclick="document.getElementById('p13importFile').click()" title="Load a filled-in scrape JSON back into this project. Values arrive marked BLUE (scraped, unconfirmed) so you can check each against the drawings. Also accepts a full saved export.">Import scrape</button>
    <input type="file" id="p13importFile" accept=".json" style="display:none" onchange="importState(event)">
    <button onclick="exportTemplate()" title="Download a blank JSON listing every Part 13 field — hand this to an AI along with the drawings, then bring the filled version back with Import scrape.">Scrape template</button>
    <button onclick="resetAll()" style="border-color:#7f1d1d;color:#fca5a5" title="Clear the Part 13 compliance data for the selected project only. Fees, timeline and hours are not affected.">Clear Part 13</button>
  </span>
</header>
<nav id="topnav">
  <button data-side="business">Project Admin</button>
  <button data-side="compliance">Project Data</button>
</nav>
<main>
  <div id="trkRoot">
    <div class="tabstrip"><nav id="pagenav"></nav></div>
    <div id="app"></div>
  </div>
  <div id="p13Root">
    <div class="tabstrip">
      <div id="projPick"></div>
      <nav id="p13nav"></nav>
    </div>
    
  <div class="legend">
    <span class="lg-red">RED — no data</span>
    <span class="lg-blue">BLUE — scraped (unconfirmed)</span>
    <span class="lg-green">GREEN — confirmed documented</span>
    <span class="lg-purple">PURPLE — assumed / manual</span>
    <span class="lg-orange">ORANGE — calculated</span>
  </div>
  <div id="p13app"></div>

  </div>
</main>
<footer>
  <span id="suiteFoot"></span>
  <span id="savenote"></span><span id="p13savenote" style="display:none"></span>
</footer>

<script>
/* ==================== PROJECT TRACKER ==================== */

let T={ projects:[], seq:1, page:"data", cur:null, goal:2500, calYM:null, costs:[], tombs:{} };
const STKEY="project_tracker_v1";

/* ---- ids -------------------------------------------------------------
   Ids used to come from a per-device counter (String(T.seq++)), so the
   desktop and the iPad both minted "5" for different projects — which makes
   them impossible to merge. Ids are now collision-proof. Old numeric ids are
   migrated ONCE, derived from the job number (or a content hash) so BOTH
   devices independently arrive at the same new id for the same record. */
function uid(){ return window.GSync? GSync.newId() : Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,8); }
function hash32(s){ let h=5381; for(let i=0;i<s.length;i++) h=((h<<5)+h+s.charCodeAt(i))>>>0; return h.toString(36); }
function migrateIds(){
  const old=/^\d+$/, used={}, remap={};
  const assign=(rec,prefix,natural)=>{
    const bare=JSON.stringify(Object.assign({},rec,{id:0,updatedAt:0}));
    let base = (natural&&String(natural).trim())
      ? prefix+"_"+String(natural).trim().toLowerCase().replace(/\s+/g,"")
      : prefix+"_h"+hash32(bare);
    let id=base,n=2; while(used[id]) id=base+"_"+(n++);
    used[id]=1; return id;
  };
  let changed=false;
  for(const p of T.projects){ if(p&&old.test(String(p.id))){ const nid=assign(p,"p",p.job); remap[p.id]=nid; p.id=nid; changed=true; } else if(p) used[p.id]=1; }
  for(const c of T.costs){ if(c&&old.test(String(c.id))){ c.id=assign(c,"c",""); changed=true; } else if(c) used[c.id]=1; }
  if(T.cur&&remap[T.cur]) T.cur=remap[T.cur];
  return changed;
}

/* ---- change stamping -------------------------------------------------
   Every save diffs each record against how it looked at the last save and
   stamps only what actually changed. That keeps merge decisions honest —
   opening the tracker doesn't make this device "win" every project. */
let _sig={};
function baseline(){ _sig={}; stampChanges(true); }
function stampChanges(quiet){
  const now=new Date().toISOString(), seen={};
  for(const arr of [T.projects,T.costs]){
    for(const r of (arr||[])){
      if(!r||r.id==null) continue;
      const bare=JSON.stringify(Object.assign({},r,{updatedAt:0}));
      seen[r.id]=bare;
      if(!quiet && _sig[r.id]!==undefined && _sig[r.id]!==bare) r.updatedAt=now;
      if(!quiet && _sig[r.id]===undefined && Object.keys(_sig).length) r.updatedAt=r.updatedAt||now;
    }
  }
  const setSig=JSON.stringify({goal:T.goal,page:T.page,cur:T.cur,calYM:T.calYM});
  if(!quiet && _sig.__set!==undefined && _sig.__set!==setSig) T.settingsAt=now;
  seen.__set=setSig;
  _sig=seen;
}
/* deletion tombstones — so a delete here isn't undone by a device that still has it */
function tombstone(id){ if(!T.tombs) T.tombs={}; T.tombs[id]=new Date().toISOString(); }

function save(){ stampChanges();
  try{ localStorage.setItem(STKEY,JSON.stringify(T)); note("saved "+new Date().toLocaleTimeString()); }catch(e){ note("autosave unavailable — use Export"); }
  if(window.GSync) GSync.touch(); }
function ensureShape(){ if(!T.projects) T.projects=[]; if(!T.page) T.page="data"; if(!T.seq) T.seq=1; if(!(Number(T.goal)>0)) T.goal=2500; if(!T.calYM) T.calYM=todayISO().slice(0,7); if(!T.costs) T.costs=[]; if(!T.tombs) T.tombs={}; }
function load(){ try{ const x=localStorage.getItem(STKEY); if(x) T=JSON.parse(x); }catch(e){} ensureShape();
  if(migrateIds()){ try{ localStorage.setItem(STKEY,JSON.stringify(T)); }catch(e){} }
  baseline(); }
function note(t){ document.getElementById("savenote").textContent=t; }

const COMPLEXITY=["Low","Medium","High"];
const GST=0.10, PRELIM=0.70;
const FEEFIELDS={fee:1,pfee:1,adj:1};
const STATUSES=[
 {id:"AFP",  l:"Awaiting Fee Proposal",                           days:5,  act:"Issue Fee Proposal"},
 {id:"AFA",  l:"Awaiting Fee Acceptance",                         days:14, act:"Follow up client"},

/* ============================ DATES ============================ */
function todayISO(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function pd(iso){ const [y,m,d]=iso.split("-").map(Number); return new Date(y,m-1,d); }
function iso(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function addDays(isoD,n){ const d=pd(isoD); d.setDate(d.getDate()+n); return iso(d); }
function dmy(isoD){ if(!isoD) return "—"; const [y,m,d]=isoD.split("-"); return d+"/"+m+"/"+y; }
function daysBetween(a,b){ return Math.round((pd(b)-pd(a))/86400000); }
function fyStartISO(){ const d=new Date(); const y=(d.getMonth()>=6)?d.getFullYear():d.getFullYear()-1; return y+"-07-01"; }
function fyEndISO(){ const s=pd(fyStartISO()); return (s.getFullYear()+1)+"-06-30"; }

/* ============================ PROJECT HELPERS ============================ */
function newProject(){ const p={id:uid(), updatedAt:new Date().toISOString(), job:"",addr:"",client:"",email:"",designer:"",type:"",dwell:"",cx:"",fee:"",pfee:"",adj:"",hold:false,log:[]}; T.projects.push(p); T.cur=p.id; T.page="data"; save(); render(); }
function delProject(id){ if(!confirm("Delete this project and its timeline?")) return; T.projects=T.projects.filter(p=>p.id!==id); tombstone(id); if(T.cur===id) T.cur=null; save(); render(); }
function proj(id){ return T.projects.find(p=>p.id===id); }
function curProj(){ return T.cur? proj(T.cur) : null; }
function toggleHold(){ const p=curProj(); if(!p) return; p.hold=!p.hold; save(); render(); }
function sortedLog(p){ return p.log.slice().sort((a,b)=> a.d===b.d ? (a.i||0)-(b.i||0) : (a.d<b.d?-1:1)); }
function curStatus(p){ const l=sortedLog(p); return l.length? l[l.length-1] : null; }
function deadlineOf(p){ if(p.hold) return null; const c=curStatus(p); if(!c) return null; const s=ST[c.st]; if(!s||s.days==null) return null; return {due:addDays(c.d,s.days), act:s.act, days:s.days}; }
function fee(p){ const f=Number(p.fee); return isFinite(f)?f:0; }
function pfeeEx(p){ const x=Number(p.pfee); return (isFinite(x)&&x>0)? x : fee(p)*PRELIM; }
function ffeeEx(p){ return Math.max(fee(p)-pfeeEx(p),0); }
function adjFee(p){ const f=Number(p.adj); return isFinite(f)?f:0; }
function money(x){ return "$"+Math.round(x).toLocaleString("en-AU"); }
function money2(x){ return "$"+x.toLocaleString("en-AU",{minimumFractionDigits:2,maximumFractionDigits:2}); }
function projHours(p){ return (p.log||[]).reduce((a,e)=>a+(Number(e.h)||0),0); }
function projPaid(p){ let v=0; for(const e of (p.log||[])){ if(e.st==="PAIDP") v+=pfeeEx(p); if(e.st==="PAIDF") v+=ffeeEx(p); } return v; }
function rateOf(v,h){ return h>0? v/h : null; }
/* $/hr is only meaningful once an invoice has been PAID — before that the
   fee is a quote, not money earned, and the rate flatters the job. */
function paidRateOf(p){ const h=projHours(p), v=projPaid(p); return (h>0&&v>0)? v/h : null; }
function paidRateTxt(p){ const r=paidRateOf(p); return r==null? "—" : money(r)+"/hr"; }
function hasPaid(p){ return projPaid(p)>0; }
function rateTxt(v,h){ const r=rateOf(v,h); return r==null? "—" : money(r)+"/hr"; }
function hTxt(h){ return h? String(Number(h.toFixed(2))) : "—"; }
function fyHours(){ const a=fyStartISO(), b=fyEndISO(); let h=0;
  for(const p of T.projects) for(const e of (p.log||[])) if(e.d>=a&&e.d<=b) h+=Number(e.h)||0;
  return h; }
function lastEvent(p,ids){ const l=sortedLog(p).filter(e=>ids.includes(e.st)); return l.length?l[l.length-1]:null; }
function hasAccepted(p){ return p.log.some(e=>["ACC","INVP","PAIDP","INVF","PAIDF","DONE","ADJ"].includes(e.st)); }

function pendingValue(p){ const c=curStatus(p); const f=fee(p);
  if(!c) return {v:f, l:"full fee (pipeline)"};
  switch(c.st){
    case "AFP": case "AFA": return {v:f, l:"full fee (pipeline)"};
    case "ACC": return {v:f, l:"full fee (accepted)"};
    case "INVP": return {v:pfeeEx(p), l:"prelim invoice outstanding"};
    case "PAIDP": return {v:ffeeEx(p), l:"final stage remaining"};
    case "INVF": return {v:ffeeEx(p), l:"final invoice outstanding"};
    case "PAIDF": return {v:adjFee(p), l: adjFee(p)?"adjustment (unbilled)":"fully invoiced & paid"};
    case "DONE": return {v:0, l:"complete"};
    case "ADJ": return {v:adjFee(p), l:"adjustment invoice outstanding"};
  }
  return {v:0,l:""};
}

/* actual money received (ex GST) */
function payments(){
  const out=[];
  for(const p of T.projects){
    for(const e of p.log){
      if(e.st==="PAIDP") out.push({d:e.d, job:p.job||("#"+p.id), id:p.id, client:p.client, stage:"Preliminary", v:pfeeEx(p)});
      if(e.st==="PAIDF") out.push({d:e.d, job:p.job||("#"+p.id), id:p.id, client:p.client, stage:"Final", v:ffeeEx(p)});
    }
  }
  return out.sort((a,b)=>a.d<b.d?-1:1);
}

/* expected FUTURE receipts (ex GST) — only jobs with an accepted fee, not on hold.
   Prelim expected: INVP date+7, else ACC date+21 (14 d report + 7 d payment).
   Final expected: INVF date+7, else PAIDP date+35 (28 d finalisation + 7 d payment), else prelim-expected+35.
   Adjustment expected: ADJ date+14. Past-due expectations roll forward to today+7. */
function expectedReceipts(){
  const out=[]; const today=todayISO();
  for(const p of T.projects){
    if(p.hold||!hasAccepted(p)) continue;
    const cs=curStatus(p); if(!cs||cs.st==="DONE") { /* complete: no further projections except unpaid adj */ }
    const paidP=lastEvent(p,["PAIDP"]), paidF=lastEvent(p,["PAIDF"]);
    const done=cs&&cs.st==="DONE";
    let prelimDate=null;
    if(!paidP&&!paidF&&!done&&fee(p)>0){
      const invp=lastEvent(p,["INVP"]), acc=lastEvent(p,["ACC"]);
      if(invp) prelimDate=addDays(invp.d,7); else if(acc) prelimDate=addDays(acc.d,21);
      if(prelimDate&&prelimDate<today) prelimDate=addDays(today,7);
      if(prelimDate) out.push({d:prelimDate, job:p.job||("#"+p.id), id:p.id, stage:"Preliminary (expected)", v:pfeeEx(p)});
    }
    if(!paidF&&!done&&fee(p)>0){
      const invf=lastEvent(p,["INVF"]);
      let finDate=null;
      if(invf) finDate=addDays(invf.d,7);
      else if(paidP) finDate=addDays(paidP.d,35);
      else if(prelimDate) finDate=addDays(prelimDate,35);
      if(finDate&&finDate<today) finDate=addDays(today,7);
      if(finDate) out.push({d:finDate, job:p.job||("#"+p.id), id:p.id, stage:"Final (expected)", v:ffeeEx(p)});
    }
    const adj=lastEvent(p,["ADJ"]);
    if(adj&&adjFee(p)>0){
      let ad=addDays(adj.d,14); if(ad<today) ad=addDays(today,7);
      out.push({d:ad, job:p.job||("#"+p.id), id:p.id, stage:"Adjustment (expected)", v:adjFee(p)});
    }
  }
  return out.sort((a,b)=>a.d<b.d?-1:1);
}

/* 2026-27 resident income tax + 2% Medicare levy (no offsets/deductions/LITO) */
function incomeTax(x){
  const b=[[18200,0],[45000,.15],[135000,.30],[190000,.37],[Infinity,.45]];
  let t=0,lo=0;
  for(const [hi,r] of b){ if(x>lo) t+=(Math.min(x,hi)-lo)*r; lo=hi; if(x<=hi) break; }
  return t + Math.max(0,x)*0.02;
}

/* ============================ FY SERIES ============================ */
function fySeries(){
  const start=fyStartISO(), end=fyEndISO(), today=todayISO();
  const nDays=daysBetween(start,end)+1;
  const elapsed=Math.max(1,Math.min(daysBetween(start,today)+1,nDays));
  const dailyPaid=new Array(nDays).fill(0), dailyExp=new Array(nDays).fill(0), dailyCost=new Array(nDays).fill(0);
  for(const x of payments()){ const i=daysBetween(start,x.d); if(i>=0&&i<nDays) dailyPaid[i]+=x.v; }
  for(const x of expectedReceipts()){ const i=daysBetween(start,x.d); if(i>=0&&i<nDays) dailyExp[i]+=x.v; }
  for(const x of costOccurrences(start,end)){ const i=daysBetween(start,x.d); if(i>=0&&i<nDays) dailyCost[i]+=x.v; }
  const cumPaid=[],cumExp=[],cumCost=[]; let a=0,b=0,cc=0;
  for(let i=0;i<nDays;i++){ a+=dailyPaid[i]; b+=dailyPaid[i]+dailyExp[i]; cc+=dailyCost[i]; cumPaid.push(a); cumExp.push(b); cumCost.push(cc); }
  const toDate=cumPaid[elapsed-1];
  const avgPerDay=toDate/elapsed;
  const rollFY=avgPerDay*nDays;
  const expFY=cumExp[nDays-1];
  const projFY=Math.max(rollFY,expFY);
  const costToDate=cumCost[elapsed-1], costFY=cumCost[nDays-1];
  const profitToDate=toDate-costToDate, profitFY=projFY-costFY;
  return {start,end,today,nDays,elapsed,cumPaid,cumExp,cumCost,toDate,avgPerDay,rollFY,expFY,projFY,costToDate,costFY,profitToDate,profitFY};
}
function monthPaid(y,m){ const pre=y+"-"+String(m).padStart(2,"0");
  return payments().filter(x=>x.d.startsWith(pre)).reduce((s,x)=>s+x.v,0); }

/* ============================ COSTS ============================ */
const COSTCATS=["Software / subscription","Equipment","Insurance","Registration / accreditation","Travel / vehicle","Office / utilities","Training","Other"];
const FREQS=["one-off","weekly","fortnightly","monthly","quarterly","yearly"];
const GSTOPTS=[["inc","Incl GST"],["free","No GST"]];
/* Costs are entered as the FULL amount paid. GST is 1/11 of that, and is
   an input tax credit rather than an expense — so profit and projection
   figures use the ex-GST amount, while cash figures use the gross. */
function costGross(c){ const v=Number(c.amt); return isFinite(v)?v:0; }
function costGst(c){ return (c.gstf==="free")? 0 : costGross(c)/11; }
function costNet(c){ return costGross(c)-costGst(c); }
function newCost(){ T.costs.push({id:uid(), updatedAt:new Date().toISOString(), desc:"", cat:"", amt:"", gstf:"inc", freq:"one-off", start:todayISO(), end:""}); save(); render(); }
function delCost(id){ T.costs=T.costs.filter(c=>c.id!==id); tombstone(id); save(); render(); }
function nextDate(d,freq){ const x=pd(d);
  if(freq==="weekly") x.setDate(x.getDate()+7);
  else if(freq==="fortnightly") x.setDate(x.getDate()+14);
  else if(freq==="monthly") x.setMonth(x.getMonth()+1);
  else if(freq==="quarterly") x.setMonth(x.getMonth()+3);
  else x.setFullYear(x.getFullYear()+1);
  return iso(x); }
function costOccurrences(a,b){ const out=[];
  for(const c of (T.costs||[])){
    const gross=costGross(c); if(!gross||!c.start) continue;
    const net=costNet(c), gst=costGst(c);
    const add=d=>out.push({d, v:net, gross, gst, desc:c.desc, cat:c.cat, id:c.id});
    if(!c.freq||c.freq==="one-off"){ if(c.start>=a&&c.start<=b) add(c.start); continue; }
    let d=c.start; const stop=(c.end&&c.end<b)? c.end : b; let g=0;
    while(d<=stop&&g++<1200){ if(d>=a) add(d); d=nextDate(d,c.freq); }
  }
  return out.sort((x,y)=>x.d<y.d?-1:1); }
function monthCost(y,m){ const dim=new Date(y,m,0).getDate(); const mm=String(m).padStart(2,"0");
  return costOccurrences(y+"-"+mm+"-01", y+"-"+mm+"-"+String(dim).padStart(2,"0")).reduce((a,x)=>a+x.v,0); }

/* ============================ RENDER ============================ */
const PAGES=[["roster","Roster"],["data","Project"],["income","Projection"],["cal","Calendar"],["costs","Costs & BAS"],["docs","Documents"]];
function setPage(pg){ T.page=pg; save(); render(); window.scrollTo(0,0); }
/* Recompute every derived fee figure in place, without a re-render — a full
   render would steal focus and reset the caret mid-keystroke, which is why
   these used to sit stale until you clicked something else. */
function syncFeeFields(){
  const p=curProj(); if(!p) return;
  const f=fee(p), pe=pfeeEx(p), fe=ffeeEx(p), a=adjFee(p);
  const set=(id,txt)=>{ const el=document.getElementById(id); if(!el) return;
    if(el.tagName==="INPUT") el.value=txt; else el.innerHTML=txt; };
  const sub=(ex,pct)=>'<span style="color:var(--muted);font-weight:400"> ('+money2(ex)+' ex · '+pct+'%)</span>';
  set("fx_ffeeEx",  f? money2(fe):"—");
  set("fx_ffeeInc", f? money2(fe*(1+GST)):"—");
  set("fx_gst",     money2(f*GST));
  set("fx_pinv",    money2(pe*(1+GST))+sub(pe, f?Math.round(pe/f*100):70));
  set("fx_finv",    money2(fe*(1+GST))+sub(fe, f?Math.round(fe/f*100):30));
  /* keep the ex/incl GST twins in step, but never fight the field being typed in */
  const act=document.activeElement;
  document.querySelectorAll("[data-pfinc]").forEach(el=>{
    if(el===act) return;
    const k=el.dataset.pfinc;
    const base = k==="fee"? f : (Number(p.pfee)>0? pe : null);
    el.value = (base==null||!base)? "" : (+(base*(1+GST)).toFixed(2));
  });
  document.querySelectorAll("[data-pf]").forEach(el=>{
    if(el===act) return;
    if(el.dataset.pf==="fee"||el.dataset.pf==="pfee"||el.dataset.pf==="adj"){
      const v=p[el.dataset.pf]; el.value=(v===""||v==null)?"":v;
    }
  });
}
function selectProj(id){ T.cur=id; T.page="data"; save(); render(); window.scrollTo(0,0); }

function chipFor(p){
  if(p.hold) return '<span class="chip done">⏸ ON HOLD</span>';
  const c=curStatus(p);
  if(!c) return '<span class="chip info">NEW — no status logged</span>';
  if(c.st==="DONE") return '<span class="chip done">'+ST[c.st].l+'</span>';
  const dl=deadlineOf(p); if(!dl) return '<span class="chip info">'+ST[c.st].l+'</span>';
  const left=daysBetween(todayISO(),dl.due);
  const cls= left<0 ? "late" : left<=3 ? "warn" : "ok";
  return '<span class="chip '+cls+'">'+ST[c.st].l+'</span>';
}

  const hrs=projHours(p), paidNow=projPaid(p), totFee=fee(p)+adjFee(p);

    +'<div class="statbox"><div class="lbl">Hours logged</div><div class="val">'+hTxt(hrs)+'</div><div class="sub">'+nTimed+' entr'+(nTimed===1?"y":"ies")+' with time recorded</div></div>'
    +'<div class="statbox"><div class="lbl">Actual $/hr <span style="font-weight:400">(paid work)</span></div><div class="val">'+paidRateTxt(p)+'</div><div class="sub">'
      +(hasPaid(p)? money(paidNow)+' received ÷ '+hTxt(hrs)+' h'
                  : 'no invoice paid yet — rate appears once the first payment is logged')+'</div></div>'
    +'<div class="statbox" style="opacity:.72"><div class="lbl">Projected $/hr <span style="font-weight:400">(if fully paid)</span></div><div class="val">'+rateTxt(totFee,hrs)+'</div><div class="sub">'+money(totFee)+' ex GST ÷ hours logged — forecast only</div></div>'
    +'</div></section>';

  const dl=deadlineOf(p);
  h+='<section class="card"><div class="sec-head"><h2>Status</h2>'+chipFor(p)
    +(dl?'<span style="font-size:11.5px;color:var(--muted)">deadline '+dmy(dl.due)+' — '+dl.act+'</span>':'')
    +'<button class="abtn hold" onclick="toggleHold()">'+(p.hold?"▶ Resume project":"⏸ Put on hold")+'</button>'
    +'</div><div class="sec-body">';
  if(p.hold) h+='<div class="banner">⏸ On hold — follow-ups, deadlines and income projections for this job are paused. Click “Resume project” to reactivate.</div>';
  h+='<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">'
    +'<select id="stSel" style="padding:6px;border-radius:6px;border:1.5px solid var(--line)">'+STATUSES.map(s=>'<option value="'+s.id+'">'+s.l+'</option>').join("")+'</select>'
    +'<label style="font-size:12px;color:var(--muted)">date <input type="date" id="stDate" value="'+todayISO()+'" style="padding:5px;border-radius:6px;border:1.5px solid var(--line)"></label>'
    +'<label style="font-size:12px;color:var(--muted)">hours since last entry <input type="number" step="0.25" min="0" id="stHours" placeholder="e.g. 3.5" style="width:88px;padding:5px;border-radius:6px;border:1.5px solid var(--line)"></label>'
    +'<button class="cbtn" onclick="logStatus()">✓ Confirm — log to timeline</button>'
    +'</div><div style="font-size:11px;color:var(--muted);margin-top:6px">Date defaults to today — override before confirming if logging retrospectively. Hours = time spent on <b>this stage</b> (since the previous entry); the timeline keeps the running total, and any hours can be edited later. Leave blank if not tracking.</div>';
  const lg=sortedLog(p);
  if(lg.length){
    h+='<h4 style="font-size:12px;margin:12px 0 6px">Timeline</h4><table class="grid"><tr><th>Logged</th><th>Status</th><th>Deadline</th><th>Action due</th><th>Hours</th><th>Total hrs</th><th></th></tr>';
    let run=0;
    lg.forEach((e,i)=>{ const s=ST[e.st]; run+=Number(e.h)||0; const idx=p.log.indexOf(e);
      h+='<tr><td>'+dmy(e.d)+'</td><td>'+s.l+'</td><td>'+(s.days!=null?dmy(addDays(e.d,s.days))+' ('+s.days+' d)':'—')+'</td><td>'+s.act+'</td>'
        +'<td style="width:82px"><div class="cell"><input type="number" step="0.25" min="0" data-lh="'+idx+'" value="'+(e.h||"")+'" placeholder="—"></div></td>'
        +'<td style="font-variant-numeric:tabular-nums">'+hTxt(run)+'</td>'
        +'<td><button class="abtn del" onclick="delLog('+i+')">✕</button></td></tr>'; });
    h+='</table>';
  }
  h+='</div></section>';
  return h;
}
function logStatus(){
  const p=curProj(); if(!p) return;
  const st=document.getElementById("stSel").value;
  const d=document.getElementById("stDate").value||todayISO();
  const hEl=document.getElementById("stHours");
  const hv=hEl? Number(hEl.value):0;
  const e={st,d,i:p.log.length};
  if(isFinite(hv)&&hv>0) e.h=hv;
  p.log.push(e);
  save(); render();
}
function delLog(sortedIdx){
  const p=curProj(); if(!p) return;
  const e=sortedLog(p)[sortedIdx];
  p.log=p.log.filter(x=>x!==e);
  save(); render();
}

/* ---------- tab 2: Project Roster ---------- */
function jobSortKey(p){
  /* sequential by project number, ascending; numeric so 26100 follows 26099,
     and anything without a number sorts last rather than first */
  const raw=String(p.job||"").trim();
  const n=parseFloat(raw.replace(/[^0-9.]/g,""));
  return isFinite(n)&&raw!=="" ? [0,n,raw] : [1,0,raw.toLowerCase()];
}
function byJobNumber(a,b){
  const x=jobSortKey(a.p), y=jobSortKey(b.p);
  if(x[0]!==y[0]) return x[0]-y[0];
  if(x[1]!==y[1]) return x[1]-y[1];
  return x[2]<y[2]?-1:x[2]>y[2]?1:0;
}
function isComplete(r){ return !!(r.c && r.c.st==="DONE"); }

function rosterTable(rows, opts){
  let h='<table class="grid"><tr><th>Job #</th><th>Client</th><th>Address</th><th>Type</th><th>Dwl</th><th>Cx</th>'
    +'<th>Fee ex GST</th><th>Hrs</th><th>$/hr</th><th>Status</th><th>Since</th>'
    +(opts.done? '<th>Completed</th>' : '<th>Deadline</th><th>Action on deadline</th><th>Days</th>')
    +'<th>Next $ (ex GST)</th></tr>';
  for(const r of rows){
    const pv=pendingValue(r.p);
    let daysChip="—";
    if(r.p.hold) daysChip='<span class="chip done">⏸ hold</span>';
    else if(r.left!=null){
      const cls=r.left<0?"late":r.left<=3?"warn":"ok";
      daysChip='<span class="chip '+cls+'">'+(r.left<0?Math.abs(r.left)+" d OVERDUE":r.left+" d")+'</span>';
    }
    h+='<tr class="clickable" onclick="selectProj(\''+r.p.id+'\')">'
      +'<td><b>'+(r.p.job||"—")+'</b></td><td>'+(r.p.client||"—")+'</td>'
      +'<td style="font-size:11.5px">'+(r.p.addr||"—")+'</td><td>'+(r.p.type||"—")+'</td>'
      +'<td>'+(r.p.dwell||"—")+'</td><td>'+(r.p.cx||"—")+'</td>'
      +'<td>'+money(fee(r.p))+'</td>'
      +'<td>'+hTxt(projHours(r.p))+'</td>'
      +'<td'+(hasPaid(r.p)?'':' style="color:var(--muted)"')+' title="'
        +(hasPaid(r.p)?'money received ÷ hours logged':'no invoice paid yet — $/hr is only calculated once a payment is logged')+'">'
        +paidRateTxt(r.p)+'</td>'
      +'<td style="font-size:11.5px">'+(r.p.hold?'⏸ On hold':(r.c?ST[r.c.st].l:"—"))+'</td>'
      +'<td>'+(r.c?dmy(r.c.d):"—")+'</td>';
    if(opts.done){
      h+='<td>'+(r.c?dmy(r.c.d):"—")+'</td>';
    } else {
      h+='<td>'+(r.dl?dmy(r.dl.due):"—")+'</td>'
        +'<td style="font-size:11.5px">'+(r.dl?r.dl.act:(r.p.hold?"paused":"log a status"))+'</td>'
        +'<td>'+daysChip+'</td>';
    }
    h+='<td title="'+pv.l+'">'+(pv.v?money(pv.v):"—")+'</td></tr>';
  }
  return h+'</table>';
}

function pageRoster(){
  const all=T.projects.map(p=>{
    const c=curStatus(p), dl=deadlineOf(p);
    return {p,c,dl,left: dl? daysBetween(todayISO(),dl.due):null};
  });
  const active=all.filter(r=>!isComplete(r)).sort(byJobNumber);
  const done  =all.filter(isComplete).sort(byJobNumber);

  if(!all.length){
    return '<section class="card"><div class="sec-head"><h2>Project Roster</h2>'
      +'<button class="addrow" onclick="newProject()">+ new project</button></div>'
      +'<div class="sec-body"><div class="banner">No projects yet — click “+ new project”.</div></div></section>';
  }

  let pipeline=0, overdue=0;
  for(const r of active){ if(!r.p.hold){ pipeline+=pendingValue(r.p).v; if(r.left!=null&&r.left<0) overdue++; } }

  let h='<section class="card"><div class="sec-head"><h2>Active — '+active.length+' project'+(active.length===1?"":"s")+'</h2>'
    +'<span style="font-size:11px;color:var(--muted)">ordered by project number</span>'
    +'<span style="flex:1"></span>'
    +'<button class="addrow" onclick="newProject()">+ new project</button>'
    +'<button class="addrow" style="border-color:var(--green);color:var(--green)" onclick="exportRosterCSV()">⬇ CSV</button>'
    +'</div><div class="sec-body">';
  h += active.length ? rosterTable(active,{done:false})
     : '<div class="banner">Nothing active — every project has been completed.</div>';
  h += '<div style="font-size:12px;color:var(--muted);margin-top:8px">Pipeline / outstanding value (active, non-hold, ex GST): <b>'
    +money(pipeline)+'</b> · overdue actions: <b style="color:'+(overdue?"var(--red)":"var(--green)")+'">'+overdue+'</b>'
    +' · click any row to open it.</div></div></section>';

  h+='<section class="card"><div class="sec-head"><h2>Completed — '+done.length+' project'+(done.length===1?"":"s")+'</h2>'
    +'<span style="font-size:11px;color:var(--muted)">final reports issued</span></div><div class="sec-body">';
  h += done.length ? rosterTable(done,{done:true})
     : '<div class="banner">No completed projects yet — a job moves here once its status is “'+ST.DONE.l+'”.</div>';
  h += '</div></section>';
  return h;
}

function exportRosterCSV(){
  const rows=[["Job #","Client","Address","Type","Dwellings","Complexity","Fee ex GST",
               "Hours","$/hr (paid)","Status","Since","Deadline","Action","Days left","Next $ ex GST","Complete"]];
  const list=T.projects.map(p=>{
    const c=curStatus(p), dl=deadlineOf(p);
    return {p,c,dl,left: dl? daysBetween(todayISO(),dl.due):null};
  }).sort(byJobNumber);
  for(const r of list){
    const pv=pendingValue(r.p), pr=paidRateOf(r.p);
    rows.push([r.p.job||"",r.p.client||"",r.p.addr||"",r.p.type||"",r.p.dwell||"",r.p.cx||"",
      fee(r.p)||"",projHours(r.p)||"",pr==null?"":pr.toFixed(2),
      r.p.hold?"On hold":(r.c?ST[r.c.st].l:""),r.c?r.c.d:"",r.dl?r.dl.due:"",r.dl?r.dl.act:"",
      r.left==null?"":r.left, pv.v||"", isComplete(r)?"yes":"no"]);
  }
  suiteCSV("project_roster_"+todayISO()+".csv", rows);
}



/* ---------- tab 3: Projection ---------- */
function pageIncome(){
  const s=fySeries();
  const goalFY=T.goal/7*s.nDays;
  const t=pd(todayISO());
  const thisY=t.getFullYear(), thisM=t.getMonth()+1;
  const lm=new Date(thisY,thisM-2,1);
  const paidThis=monthPaid(thisY,thisM), paidLast=monthPaid(lm.getFullYear(),lm.getMonth()+1);
  const costThis=monthCost(thisY,thisM), costLast=monthCost(lm.getFullYear(),lm.getMonth()+1);
  const dimThis=new Date(thisY,thisM,0).getDate(), dimLast=new Date(lm.getFullYear(),lm.getMonth()+1,0).getDate();
  const goalThis=T.goal/7*dimThis, goalLast=T.goal/7*dimLast;
  const delta=paidThis-paidLast;
  const remDays=Math.max(1,s.nDays-s.elapsed);
  const gap=goalFY-s.projFY;
  const needWeekly=gap>0? gap/(remDays/7) : 0;
  const tax1=incomeTax(s.toDate), tax2=incomeTax(s.projFY), taxG=incomeTax(goalFY);
  const mchip=(v,g)=> v>=g? '<span class="chip ok">over goal +'+money(v-g)+'</span>' : '<span class="chip late">under goal −'+money(g-v)+'</span>';

  let h='<section class="card"><div class="sec-head"><h2>Projection — FY '+fyStartISO().slice(0,4)+'/'+fyEndISO().slice(2,4)+' (all values ex GST)</h2>'
    +'<label style="font-size:12px;color:var(--muted)">weekly income goal $ <input type="number" step="50" data-goal="1" value="'+T.goal+'" style="width:90px;padding:5px;border-radius:6px;border:1.5px solid var(--line)"></label>'
    +'</div><div class="sec-body">'
    +'<canvas id="incChart" width="1100" height="430" style="width:100%;background:#fff;border:1px solid var(--line);border-radius:8px"></canvas>'
    +'<div style="font-size:11px;color:var(--muted);margin-top:4px">'
    +'— <span style="color:var(--green);font-weight:700">paid</span> (money actually received) · '
    +'<span style="color:var(--orange);font-weight:700">expected</span> (paid + scheduled invoicing from accepted jobs, by due month; on-hold jobs excluded) · '
    +'<span style="color:var(--blue);font-weight:700">projected</span> (greater of rolling FY average and the expected schedule) · '
    +'<span style="color:#6b7280;font-weight:700">goal</span> ($'+Number(T.goal).toLocaleString()+'/week ≈ '+money(goalFY)+'/yr) · '
    +'<span style="color:var(--red);font-weight:700">costs</span> (deductibles &amp; subscriptions, cumulative)</div>'

    +'<div style="margin-top:12px">'
    +'<div class="statbox"><div class="lbl">Income to date (paid, ex GST)</div><div class="val">'+money(s.toDate)+'</div><div class="sub">after tax ≈ '+money(s.toDate-tax1)+' (tax '+money(tax1)+')</div></div>'
    +'<div class="statbox"><div class="lbl">Expected FY (incl. future invoicing)</div><div class="val">'+money(s.expFY)+'</div><div class="sub">accepted jobs scheduled to month · ex GST</div></div>'
    +'<div class="statbox"><div class="lbl">Projected FY income</div><div class="val">'+money(s.projFY)+'</div><div class="sub">after tax ≈ '+money(s.projFY-tax2)+' (tax '+money(tax2)+')</div></div>'
    +'<div class="statbox"><div class="lbl">Goal FY income</div><div class="val">'+money(goalFY)+'</div><div class="sub">after tax ≈ '+money(goalFY-taxG)+' (tax '+money(taxG)+')</div></div>'
    +'</div><div>'
    +'<div class="statbox"><div class="lbl">Costs to date</div><div class="val" style="color:var(--red)">'+money(s.costToDate)+'</div><div class="sub">projected FY costs '+money(s.costFY)+' (recurring scheduled to 30 Jun)</div></div>'
    +'<div class="statbox"><div class="lbl">Profit to date (income − costs)</div><div class="val">'+money(s.profitToDate)+'</div><div class="sub">after tax ≈ '+money(s.profitToDate-incomeTax(s.profitToDate))+' (tax on profit '+money(incomeTax(s.profitToDate))+')</div></div>'
    +'<div class="statbox"><div class="lbl">Projected FY profit</div><div class="val">'+money(s.profitFY)+'</div><div class="sub">after tax ≈ '+money(s.profitFY-incomeTax(s.profitFY))+' (tax on profit '+money(incomeTax(s.profitFY))+')</div></div>'
    +(fyHours()? '<div class="statbox"><div class="lbl">Effective hourly rate (FY)</div><div class="val">'+money(s.toDate/fyHours())+'/hr</div><div class="sub">'+money(s.toDate)+' received ÷ '+hTxt(fyHours())+' h · after costs '+money(Math.max(s.profitToDate,0)/fyHours())+'/hr</div></div>':'')
    +'</div>'

    +'<h4 style="font-size:12px;margin:14px 0 6px">Monthly summary</h4><div>'
    +'<div class="statbox"><div class="lbl">Last month ('+lm.toLocaleString("en-AU",{month:"short"})+')</div><div class="val">'+money(paidLast)+'</div><div class="sub">'+mchip(paidLast,goalLast)+' <span style="color:var(--muted)">(goal '+money(goalLast)+')</span><br>costs '+money(costLast)+' → profit '+money(paidLast-costLast)+'</div></div>'
    +'<div class="statbox"><div class="lbl">This month ('+t.toLocaleString("en-AU",{month:"short"})+')</div><div class="val">'+money(paidThis)+' '+(delta>=0?'<span style="color:var(--green);font-size:14px">▲ +'+money(delta)+'</span>':'<span style="color:var(--red);font-size:14px">▼ −'+money(Math.abs(delta))+'</span>')+'</div><div class="sub">'+mchip(paidThis,goalThis)+' <span style="color:var(--muted)">(goal '+money(goalThis)+')</span><br>costs '+money(costThis)+' → profit '+money(paidThis-costThis)+'</div></div>'
    +'<div class="statbox"><div class="lbl">To beat the FY goal</div><div class="val">'+(gap>0? money(needWeekly)+"/wk" : "on track")+'</div><div class="sub">'+(gap>0? "extra needed above current projection for the remaining "+Math.round(remDays/7)+" weeks ("+money(gap)+" total)" : "projection exceeds goal by "+money(-gap))+'</div></div>'

  /* quoting benchmarks — what past jobs actually took */
  const bm={};
  for(const pr of T.projects){ const hh=projHours(pr), ff=fee(pr)+adjFee(pr);
    if(!hh||!ff) continue;
    const k=(pr.type||"—")+" · "+(pr.cx||"—");
    (bm[k]=bm[k]||{n:0,h:0,f:0,d:0}); bm[k].n++; bm[k].h+=hh; bm[k].f+=ff; bm[k].d+=Number(pr.dwell)||0; }
  const bkeys=Object.keys(bm).sort();
  if(bkeys.length){
    h+='<h4 style="font-size:12px;margin:14px 0 6px">Quoting benchmarks — what jobs actually take</h4><table class="grid"><tr><th>Job type · complexity</th><th>Jobs</th><th>Avg hours</th><th>Avg fee ex GST</th><th>Avg $/hr</th><th>Avg hrs / dwelling</th></tr>';
    for(const k of bkeys){ const b=bm[k];
      h+='<tr><td>'+k+'</td><td>'+b.n+'</td><td>'+hTxt(b.h/b.n)+'</td><td>'+money(b.f/b.n)+'</td><td>'+money(b.f/b.h)+'/hr</td><td>'+(b.d? hTxt(b.h/b.d):"—")+'</td></tr>'; }

  }

  const pays=payments().filter(x=>x.d>=s.start&&x.d<=s.end);
  const exp=expectedReceipts().filter(x=>x.d<=s.end);
  if(pays.length){
    h+='<h4 style="font-size:12px;margin:14px 0 6px">Payments received this FY</h4><table class="grid"><tr><th>Date</th><th>Job</th><th>Client</th><th>Stage</th><th>ex GST</th><th>incl GST</th></tr>';
    for(const x of pays) h+='<tr class="clickable" onclick="selectProj(\''+x.id+'\')"><td>'+dmy(x.d)+'</td><td>'+x.job+'</td><td>'+(x.client||"—")+'</td><td>'+x.stage+'</td><td>'+money2(x.v)+'</td><td>'+money2(x.v*(1+GST))+'</td></tr>';
    h+='</table>';
  }
  if(exp.length){
    h+='<h4 style="font-size:12px;margin:14px 0 6px">Expected invoicing (accepted jobs, scheduled)</h4><table class="grid"><tr><th>Expected</th><th>Job</th><th>Stage</th><th>ex GST</th><th>incl GST</th></tr>';
    for(const x of exp) h+='<tr class="clickable" onclick="selectProj(\''+x.id+'\')"><td>'+dmy(x.d)+'</td><td>'+x.job+'</td><td>'+x.stage+'</td><td>'+money2(x.v)+'</td><td>'+money2(x.v*(1+GST))+'</td></tr>';
    h+='</table>';
  }
  if(!pays.length&&!exp.length) h+='<div class="banner">No paid or expected income yet — log statuses on the Project Data tab (income projects once a fee is <b>Accepted</b>).</div>';
  h+='</div></section>';
  return h;
}
function drawIncome(){
  /* a failed canvas must never take the page down with it */
  try{ const _c=document.getElementById('incChart'); if(!_c||!_c.getContext||!_c.getContext('2d')) return; }catch(e){ return; }
  const cv=document.getElementById("incChart"); if(!cv) return;
  const s=fySeries(); const ctx=cv.getContext("2d");
  const W=cv.width,H=cv.height, L=70,R=20,Tp=20,B=40;
  ctx.clearRect(0,0,W,H);
  const goalPerDay=T.goal/7;
  const yMax=Math.max(goalPerDay*s.nDays, s.projFY, s.expFY, s.toDate, s.costFY, 10000)*1.08;
  const x=i=>L+(W-L-R)*i/(s.nDays-1);
  const y=v=>H-B-(H-B-Tp)*v/yMax;
  ctx.font="11px Segoe UI"; ctx.fillStyle="#6b7280";
  const st=pd(s.start);
  for(let m=0;m<=12;m++){
    const d=new Date(st.getFullYear(),st.getMonth()+m,1);
    const i=Math.round((d-st)/86400000); if(i<0||i>s.nDays-1) continue;
    ctx.strokeStyle="#eef2f7"; ctx.beginPath(); ctx.moveTo(x(i),Tp); ctx.lineTo(x(i),H-B); ctx.stroke();
    if(m<12) ctx.fillText(d.toLocaleString("en-AU",{month:"short"}), x(i)+4, H-B+16);
  }
  const stepv=yMax>200000?50000:yMax>80000?25000:10000;
  for(let v=0;v<=yMax;v+=stepv){
    ctx.strokeStyle="#eef2f7"; ctx.beginPath(); ctx.moveTo(L,y(v)); ctx.lineTo(W-R,y(v)); ctx.stroke();
    ctx.fillStyle="#6b7280"; ctx.fillText("$"+(v/1000)+"k", 8, y(v)+4);
  }
  ctx.strokeStyle="#cbd5e1"; ctx.beginPath(); ctx.moveTo(L,H-B); ctx.lineTo(W-R,H-B); ctx.moveTo(L,Tp); ctx.lineTo(L,H-B); ctx.stroke();
  /* goal — dotted grey */
  ctx.strokeStyle="#6b7280"; ctx.setLineDash([2,3]); ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(x(0),y(0)); ctx.lineTo(x(s.nDays-1),y(goalPerDay*s.nDays)); ctx.stroke();
  /* expected schedule — orange (solid to today, dashed beyond) */
  ctx.strokeStyle="#ea580c"; ctx.lineWidth=2; ctx.setLineDash([]);
  ctx.beginPath();
  for(let i=0;i<s.elapsed;i++){ const px=x(i),py=y(s.cumExp[i]); if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py); }
  ctx.stroke();
  ctx.setLineDash([5,4]);
  ctx.beginPath(); ctx.moveTo(x(s.elapsed-1),y(s.cumExp[s.elapsed-1]));
  for(let i=s.elapsed;i<s.nDays;i++) ctx.lineTo(x(i),y(s.cumExp[i]));
  ctx.stroke();
  /* projected — blue dashed from today to EOY */
  ctx.strokeStyle="#2563eb"; ctx.setLineDash([7,5]); ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(x(s.elapsed-1),y(s.toDate)); ctx.lineTo(x(s.nDays-1),y(s.projFY)); ctx.stroke();
  ctx.setLineDash([]);
  /* costs — red (solid to today, dashed scheduled future) */
  ctx.strokeStyle="#dc2626"; ctx.lineWidth=2; ctx.setLineDash([]);
  ctx.beginPath();
  for(let i=0;i<s.elapsed;i++){ const px=x(i),py=y(s.cumCost[i]); if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py); }
  ctx.stroke();
  ctx.setLineDash([4,4]);
  ctx.beginPath(); ctx.moveTo(x(s.elapsed-1),y(s.cumCost[s.elapsed-1]));
  for(let i=s.elapsed;i<s.nDays;i++) ctx.lineTo(x(i),y(s.cumCost[i]));
  ctx.stroke(); ctx.setLineDash([]);
  /* paid — green solid on top */
  ctx.strokeStyle="#16a34a"; ctx.lineWidth=2.5;
  ctx.beginPath();
  for(let i=0;i<s.elapsed;i++){ const px=x(i),py=y(s.cumPaid[i]); if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py); }
  ctx.stroke();
  const ti=s.elapsed-1;
  ctx.fillStyle="#16a34a"; ctx.beginPath(); ctx.arc(x(ti),y(s.cumPaid[ti]),4,0,7); ctx.fill();
  ctx.fillStyle="#1f2937"; ctx.font="bold 11px Segoe UI";
  ctx.fillText("today "+money(s.toDate), Math.min(x(ti)+8,W-150), y(s.cumPaid[ti])-8);
  ctx.lineWidth=1;
}

/* ---------- tab 4: Calendar ---------- */
function calNav(n){ const [y,m]=T.calYM.split("-").map(Number); const d=new Date(y,m-1+n,1); T.calYM=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); save(); render(); }
function calEvents(){
  const ev={};
  const push=(d,e)=>{ (ev[d]=ev[d]||[]).push(e); };
  const receipts=expectedReceipts();
  for(const x of receipts) push(x.d,{txt:x.job+" · "+x.stage.replace(" (expected)","")+" "+money(x.v),id:x.id,pay:true,late:false});
  for(const p of T.projects){
    if(p.hold) continue;
    const dl=deadlineOf(p); if(!dl) continue;
    const c=curStatus(p);
    const dup=receipts.some(x=>x.id===p.id && x.d===dl.due);
    if(dup) continue; /* payment entry already shown that day */
    const late=daysBetween(todayISO(),dl.due)<0;
    push(dl.due,{txt:(p.job||"#"+p.id)+" · "+dl.act,id:p.id,pay:["INVP","INVF"].includes(c.st),late});
  }
  return ev;
}
function pageCal(){
  const [y,m]=T.calYM.split("-").map(Number);
  const first=new Date(y,m-1,1);
  const startDow=(first.getDay()+6)%7; /* Monday first */
  const dim=new Date(y,m,0).getDate();
  const ev=calEvents(); const today=todayISO();
  let h='<section class="card"><div class="sec-head">'
    +'<button class="abtn" onclick="calNav(-1)">‹ prev</button>'
    +'<h2 style="text-align:center">'+first.toLocaleString("en-AU",{month:"long",year:"numeric"})+'</h2>'
    +'<button class="abtn" onclick="calNav(1)">next ›</button>'
    +'</div><div class="sec-body">'
    +'<div style="font-size:11px;color:var(--muted)">Each job’s next deadline &amp; action. <span class="chip pay" style="background:var(--green-bg);color:var(--green)">green $</span> = invoice payment expected · red = overdue · on-hold jobs hidden · click an entry to open the job.</div>'
    +'<div class="cal">'
    +["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map(d=>'<div class="dow">'+d+'</div>').join("");
  for(let i=0;i<startDow;i++) h+='<div class="day other"></div>';
  for(let d=1;d<=dim;d++){
    const isoD=y+"-"+String(m).padStart(2,"0")+"-"+String(d).padStart(2,"0");
    h+='<div class="day'+(isoD===today?' today':'')+'"><div class="dn">'+d+'</div>';
    for(const e of (ev[isoD]||[])){
      h+='<button class="evt'+(e.late?' late':(e.pay?' pay':''))+'" onclick="selectProj(\''+e.id+'\')">'+(e.pay&&!e.late?'💰 ':'')+e.txt+'</button>';
    }
    h+='</div>';
  }
  const cells=startDow+dim; const rem=(7-cells%7)%7;
  for(let i=0;i<rem;i++) h+='<div class="day other"></div>';
  h+='</div>';
  /* overdue spill-over list */
  const lateList=[];
  for(const [d,list] of Object.entries(calEvents())) for(const e of list) if(e.late) lateList.push({d,e});
  if(lateList.length){
    h+='<h4 style="font-size:12px;margin:12px 0 6px;color:var(--red)">Overdue actions</h4><table class="grid">';
    for(const x of lateList.sort((a,b)=>a.d<b.d?-1:1)) h+='<tr class="clickable" onclick="selectProj(\''+x.e.id+'\')"><td style="width:110px">'+dmy(x.d)+'</td><td>'+x.e.txt+'</td></tr>';
    h+='</table>';
  }
  h+='</div></section>';
  return h;
}

/* ---------- tab 5: Costs ---------- */
function costFYTotal(c){
  return costOccurrences(fyStartISO(),fyEndISO()).filter(x=>x.id===c.id).reduce((a,x)=>a+x.v,0);
}
function costFYGross(c){
  return costOccurrences(fyStartISO(),fyEndISO()).filter(x=>x.id===c.id).reduce((a,x)=>a+x.gross,0);
}
/* ---- BAS: Australian FY quarters, GST collected vs GST paid ---- */
function basQuarters(){
  const y=Number(fyStartISO().slice(0,4));
  return [{l:"Q1 · Jul–Sep",a:y+"-07-01",b:y+"-09-30"},
          {l:"Q2 · Oct–Dec",a:y+"-10-01",b:y+"-12-31"},
          {l:"Q3 · Jan–Mar",a:(y+1)+"-01-01",b:(y+1)+"-03-31"},
          {l:"Q4 · Apr–Jun",a:(y+1)+"-04-01",b:(y+1)+"-06-30"}];
}
function incomeInRange(a,b){ return payments().filter(x=>x.d>=a&&x.d<=b).reduce((s,x)=>s+x.v,0); }
function gstCollected(a,b){ return incomeInRange(a,b)*GST; }        /* fees are held ex GST */
function costsInRange(a,b){ return costOccurrences(a,b).reduce((s,x)=>s+x.v,0); }
function gstPaid(a,b){ return costOccurrences(a,b).reduce((s,x)=>s+x.gst,0); }

        +'<td style="min-width:150px"><div class="cell"><input type="text" data-cid="'+c.id+'" data-cf="desc" value="'+String(c.desc||"").replace(/"/g,"&quot;")+'" placeholder="e.g. FirstRate5 licence"></div></td>'
        +'<td><div class="cell"><select data-cid="'+c.id+'" data-cf="cat"><option value="">—</option>'+opt(COSTCATS,c.cat)+'</select></div></td>'
        +'<td style="width:120px"><div class="cell"><input type="number" step="any" data-cid="'+c.id+'" data-cf="amt" value="'+(c.amt||"")+'"></div></td>'
        +'<td style="width:90px;color:var(--muted)" id="cg_'+c.id+'">'+(costGross(c)?money2(costGst(c)):"—")+'</td>'
        +'<td style="width:95px" id="cn_'+c.id+'"><b>'+(costGross(c)?money2(costNet(c)):"—")+'</b></td>'
        +'<td style="width:105px"><div class="cell"><select data-cid="'+c.id+'" data-cf="gstf">'+gopt+'</select></div></td>'
        +'<td><div class="cell"><select data-cid="'+c.id+'" data-cf="freq">'+opt(FREQS,c.freq||"one-off")+'</select></div></td>'
        +'<td style="width:130px"><div class="cell"><input type="date" data-cid="'+c.id+'" data-cf="start" value="'+(c.start||"")+'"></div></td>'
        +'<td style="width:130px"><div class="cell"><input type="date" data-cid="'+c.id+'" data-cf="end" value="'+(c.end||"")+'"'+((c.freq&&c.freq!=="one-off")?'':' disabled')+'></div></td>'
        +'<td style="white-space:nowrap"><b>'+money(costFYGross(c))+'</b></td>'

      +'<div class="statbox"><div class="lbl">Cash out (incl GST)</div><div class="val">'+money(fyGross)+'</div><div class="sub">GST component '+money(fyGst)+' — claimable</div></div>'

function pageBAS(){
  const today=todayISO();
  let h='<section class="card"><div class="sec-head"><h2>GST / BAS — '+fyStartISO().slice(0,4)+'–'+fyEndISO().slice(2,4)+'</h2>'
    +'<span style="font-size:11px;color:var(--muted)">GST collected on payments received, less GST paid on costs</span>'
    +'<span style="flex:1"></span>'
    +'<button class="addrow" style="border-color:var(--green);color:var(--green)" onclick="exportBASCSV()">⬇ CSV</button>'
    +'</div><div class="sec-body">';
  h+='<table class="grid"><tr><th>Quarter</th><th>Income received (ex GST)</th><th>GST collected <span style="color:var(--muted);font-weight:400">(1A)</span></th>'
    +'<th>Costs (ex GST)</th><th>GST paid <span style="color:var(--muted);font-weight:400">(1B)</span></th><th>Net GST</th><th></th></tr>';
  let tI=0,tC=0,tGc=0,tGp=0;
  for(const q of basQuarters()){
    const inc=incomeInRange(q.a,q.b), gc=gstCollected(q.a,q.b);
    const cst=costsInRange(q.a,q.b),  gp=gstPaid(q.a,q.b);
    const net=gc-gp;
    tI+=inc; tC+=cst; tGc+=gc; tGp+=gp;
    const done=q.b<today, now=(q.a<=today&&today<=q.b);
    h+='<tr'+(now?' style="background:#fffbeb"':'')+'>'
      +'<td><b>'+q.l+'</b>'+(now?' <span class="chip warn">current</span>':(done?'':' <span class="chip done">future</span>'))+'</td>'
      +'<td>'+money2(inc)+'</td><td>'+money2(gc)+'</td>'
      +'<td>'+money2(cst)+'</td><td>'+money2(gp)+'</td>'
      +'<td><b style="color:'+(net>=0?"var(--red)":"var(--green)")+'">'+money2(Math.abs(net))+'</b> '
        +'<span style="font-size:10.5px;color:var(--muted)">'+(net>=0?"to pay":"refund")+'</span></td>'
      +'<td style="font-size:11px;color:var(--muted)">'+dmy(q.a)+' – '+dmy(q.b)+'</td></tr>';
  }
  const tNet=tGc-tGp;
  h+='<tr style="background:#f9fafb"><td><b>FY total</b></td><td><b>'+money2(tI)+'</b></td><td><b>'+money2(tGc)+'</b></td>'
    +'<td><b>'+money2(tC)+'</b></td><td><b>'+money2(tGp)+'</b></td>'
    +'<td><b>'+money2(Math.abs(tNet))+'</b> <span style="font-size:10.5px;color:var(--muted)">'+(tNet>=0?"to pay":"refund")+'</span></td><td></td></tr>';
  h+='</table>';
  h+='<div class="banner" style="background:#f0f9ff;border-color:#bae6fd;color:#0c4a6e;margin-top:10px">'
    +'<b>How these are worked out.</b> GST collected counts payments actually received — a status of '
    +'“Preliminary Invoice Paid” or “Final Invoice Paid” — not invoices merely issued, so this is a '
    +'<b>cash-basis</b> view. Fees are stored ex GST, so GST collected is 10% of them. GST paid is 1/11 of '
    +'each cost marked <i>Incl GST</i>. Adjustment invoices are not yet counted here because the timeline '
    +'has no “adjustment paid” status. A working aid for your BAS, not tax advice — check it against your '
    +'accounting records before lodging.</div>';
  h+='</div></section>';
  return h;
}

function exportCostsCSV(){
  const rows=[["Description","Category","Amount paid incl GST","GST","Ex GST","GST treatment","Frequency","Start","End","FY total paid"]];
  for(const c of T.costs){
    rows.push([c.desc||"",c.cat||"",costGross(c)||"",costGst(c).toFixed(2),costNet(c).toFixed(2),
      (c.gstf==="free"?"No GST":"Incl GST"),c.freq||"one-off",c.start||"",c.end||"",costFYGross(c).toFixed(2)]);
  }
  suiteCSV("costs_"+todayISO()+".csv", rows);
}
function exportBASCSV(){
  const rows=[["Quarter","From","To","Income received ex GST","GST collected (1A)","Costs ex GST","GST paid (1B)","Net GST"]];
  for(const q of basQuarters()){
    const gc=gstCollected(q.a,q.b), gp=gstPaid(q.a,q.b);
    rows.push([q.l,q.a,q.b,incomeInRange(q.a,q.b).toFixed(2),gc.toFixed(2),
               costsInRange(q.a,q.b).toFixed(2),gp.toFixed(2),(gc-gp).toFixed(2)]);
  }
  suiteCSV("BAS_"+fyStartISO().slice(0,4)+"-"+fyEndISO().slice(2,4)+".csv", rows);
}

/* ---------- shared render ---------- */
function updateCounts(){
  let overdue=0, active=0, done=0, hold=0, pipeline=0;
  for(const p of T.projects){
    if(p.hold){ hold++; continue; }
    const c=curStatus(p);
    if(c&&c.st==="DONE"){ done++; continue; }
    active++;
    const dl=deadlineOf(p);
    if(dl && daysBetween(todayISO(),dl.due)<0) overdue++;
    pipeline+=pendingValue(p).v;
  }
  document.getElementById("counts").innerHTML=
    '<span class="pill blue">'+active+' active</span>'
    +'<span class="pill '+(overdue?"red":"green")+'">'+overdue+' overdue</span>'
    +(hold?'<span class="pill orange">'+hold+' on hold</span>':'')
    +'<span class="pill grey">'+done+' complete</span>'
    +'<span class="pill purple">'+money(pipeline)+' pipeline ex GST</span>';
}
function render(){
  document.getElementById("fyLbl").textContent=fyStartISO().slice(0,4)+"/"+fyEndISO().slice(2,4);
  document.getElementById("pagenav").innerHTML=PAGES.map(([id,l])=>'<button data-tab="'+id+'" class="'+(T.page===id?"active":"")+'" onclick="setPage(\''+id+'\')">'+l+'</button>').join("");
  const app=document.getElementById("app");
  app.innerHTML = T.page==="data"? pageData() : T.page==="roster"? pageRoster() : T.page==="cal"? pageCal() : T.page==="costs"? pageCosts() : T.page==="docs"? pageDocs() : pageIncome();
  updateCounts();
  if(T.page==="income") drawIncome();
}

/* ---------- events: no re-render while typing ---------- */
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset.goal){ const v=Number(t.value); if(v>0) T.goal=v; save(); return; }
  if(t.dataset.biz){ biz()[t.dataset.biz]=t.value; T.bizAt=new Date().toISOString(); save(); return; }
  if(t.dataset.cid){ const c=T.costs.find(x=>x.id===t.dataset.cid); if(c){ c[t.dataset.cf]=t.value; save();
      if(t.tagName==="SELECT") render();
      else { const g=document.getElementById("cg_"+c.id), n=document.getElementById("cn_"+c.id);
             if(g) g.textContent=costGross(c)?money2(costGst(c)):"—";
             if(n) n.innerHTML=costGross(c)?"<b>"+money2(costNet(c))+"</b>":"—"; } } return; }
  if(t.dataset.lh!=null&&t.dataset.lh!==""){ const pp=curProj(); if(pp){ const ev=pp.log[Number(t.dataset.lh)];
      if(ev){ const v=Number(t.value); if(isFinite(v)&&v>0) ev.h=v; else delete ev.h; save(); } } return; }
  const p=curProj(); if(!p) return;
  if(t.dataset.pf){ p[t.dataset.pf]=t.value; save(); if(t.tagName==="SELECT") render(); else if(FEEFIELDS[t.dataset.pf]) syncFeeFields(); return; }
  if(t.dataset.pfinc){ const v=Number(t.value); p[t.dataset.pfinc]= isFinite(v)&&t.value!==""? +(v/(1+GST)).toFixed(2) : ""; save(); syncFeeFields(); return; }
});
document.addEventListener("focusout",e=>{
  const t=e.target;
  if(t && t.dataset && (t.dataset.pf||t.dataset.pfinc||t.dataset.goal||t.dataset.cid||t.dataset.lh!=null) && t.tagName!=="SELECT"){
    clearTimeout(window.__rrT);
    window.__rrT=setTimeout(()=>{ const a=document.activeElement; if(!a||!a.dataset||!(a.dataset.pf||a.dataset.pfinc||a.dataset.goal||a.dataset.cid||a.dataset.lh!=null)) render(); },200);
  }
});

/* ---------------------------------------------------------------------------
   Templates live as real .docx files in the "Section H Tools" Drive folder,
   not as base64 inside the sync file. What travels between devices is only a
   small pointer {fileId, name, modifiedTime}.

   Each device keeps its own cached copy of the bytes in localStorage, keyed on
   the Drive modifiedTime, so generating works on a train and the file is only
   re-downloaded when you've actually edited it. The cache is deliberately NOT
   part of T — it must never be pushed to Drive.
   ------------------------------------------------------------------------- */
function tplCacheKey(fileId){ return "tplcache_"+fileId; }
function tplCacheGet(fileId){
  try{ return JSON.parse(localStorage.getItem(tplCacheKey(fileId))||"null"); }catch(e){ return null; }
}
function tplCachePut(fileId, modifiedTime, data){
  try{ localStorage.setItem(tplCacheKey(fileId), JSON.stringify({modifiedTime,data})); }
  catch(e){ /* quota — generating still works, it just re-downloads next time */ }
}

/* Resolve a template to base64 bytes: cache first, Drive when it has changed,
   and legacy embedded copies still work so nothing breaks mid-migration. */
function tplBytes(kind){
  return new Promise((resolve,reject)=>{
    const t=tplRec(kind);
    if(!t) return reject(new Error("No "+tplLabel(kind).toLowerCase()+" template yet — upload one first."));
    if(!t.fileId){                                   /* pre-Drive template */
      if(t.data) return resolve(t.data);
      return reject(new Error("That template has no file attached — upload it again."));
    }
    const cached=tplCacheGet(t.fileId);
    const fetchFresh=()=>GSync.getFileB64(t.fileId,(e,b64)=>{
      if(e){
        if(cached&&cached.data) return resolve(cached.data);   /* offline → last good copy */
        return reject(new Error("Couldn't read the template from Google Drive: "+e));
      }
      tplCachePut(t.fileId, t.modifiedTime||"", b64);
      resolve(b64);
    });
    if(!window.GSync||!GSync.ready()){
      if(cached&&cached.data) return resolve(cached.data);
      return reject(new Error("Drive isn't connected on this device, and there's no cached copy of the template yet."));
    }
    /* only a metadata call unless the file actually changed */
    GSync.fileMeta(t.fileId,(e,meta)=>{
      if(e){
        if(cached&&cached.data) return resolve(cached.data);
        return reject(new Error("Couldn't reach Google Drive: "+e));
      }
      const mt=meta&&meta.modifiedTime;
      if(mt && t.modifiedTime!==mt){                 /* edited in Word since we last looked */
        t.modifiedTime=mt; t.at=new Date().toISOString(); save();
      }
      if(cached && cached.modifiedTime===mt && cached.data) return resolve(cached.data);
      fetchFresh();
    });
  });
}

function stageAmountEx(p,stage){
  if(stage==="prelim") return pfeeEx(p);
  if(stage==="final")  return ffeeEx(p);
  if(stage==="adj")    return adjFee(p);
  return fee(p)+adjFee(p);
}
function nextInvoiceNo(){
  /* Studio Bun numbering: INV<nn>-<job>, where nn counts invoices already
     issued against THIS project — matches INV01-26020 on the existing set. */
  const p=curProj();
  const n=((p&&p.docs)||[]).filter(d=>d.kind==="invoice").length+1;
  const seq="INV"+String(n).padStart(2,"0");
  return (p&&p.job)? seq+"-"+p.job : seq;
}
function longDate(isoD){
  if(!isoD) return "";
  const M=["January","February","March","April","May","June","July","August","September","October","November","December"];
  const [y,m,d]=isoD.split("-").map(Number);
  return d+" "+M[m-1]+" "+y;
}

  if(t==="Section J") return "Section J";
  if(t==="WSUD")     return "WSUD";
  return t||"assessment";
}

/* ---- .docx filling ------------------------------------------------------
   Word splits a typed {{client}} across several <w:r> runs (spellcheck,
   language marks, an edit mid-word). A naive string replace therefore misses
   most placeholders. We join each paragraph's runs, find the placeholders in
   the joined text, then write the value back into ONLY the runs that the
   placeholder actually spans — so formatting elsewhere in the paragraph is
   untouched. */
function xmlEsc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function fillDocxXml(xml, map, missing){
  return xml.replace(/<w:p(?:\s[^>]*)?>[\s\S]*?<\/w:p>/g, para=>{
    const runs=[]; const re=/(<w:t(?:\s[^>]*)?>)([\s\S]*?)(<\/w:t>)/g; let m;
    while((m=re.exec(para))!==null) runs.push({open:m[1],text:m[2],close:m[3],s:m.index,e:re.lastIndex});
    if(!runs.length) return para;
    let joined="", off=[];
    for(const r of runs){ off.push(joined.length); joined+=r.text; }
    if(joined.indexOf("{{")<0) return para;

    const hits=[]; const ph=/\{\{\s*([\w.]+)\s*\}\}/g; let x;
    while((x=ph.exec(joined))!==null) hits.push({a:x.index,b:ph.lastIndex,key:x[1]});
    if(!hits.length) return para;

    const texts=runs.map(r=>r.text);
    for(let i=hits.length-1;i>=0;i--){                 /* right-to-left keeps offsets valid */
      const hit=hits[i];
      if(!(hit.key in map)){ if(missing) missing.add(hit.key); continue; }
      const val=xmlEsc(map[hit.key]);
      for(let k=runs.length-1;k>=0;k--){
        const rs=off[k], reN=off[k]+texts[k].length;
        if(reN<=hit.a||rs>=hit.b) continue;            /* run not touched by this placeholder */
        const from=Math.max(hit.a,rs)-rs, to=Math.min(hit.b,reN)-rs;
        const insert=(rs<=hit.a)? val : "";            /* value goes in the FIRST spanned run */
        texts[k]=texts[k].slice(0,from)+insert+texts[k].slice(to);
      }
    }
    let out="", cur=0;
    for(let k=0;k<runs.length;k++){
      let open=runs[k].open;
      if(open.indexOf('xml:space')<0) open=open.replace(/>$/,' xml:space="preserve">');
      out+=para.slice(cur,runs[k].s)+open+texts[k]+runs[k].close;
      cur=runs[k].e;
    }
    return out+para.slice(cur);
  });
}


/* ---------------------------------------------------------------------------
   {{#each name}} — repeating table rows.

   A row carrying the marker is the prototype: it is cloned once per record and
   each clone filled from {{name.field}}, so every cloned row inherits the
   prototype's formatting without anything having to know what that formatting
   is. Filling reuses fillDocxXml, which already copes with Word splitting a
   placeholder across runs.

   With no records the prototype is kept and filled with em dashes — an empty
   table still reads as "nothing here", where a vanished table reads as an
   oversight.
   ------------------------------------------------------------------------- */
function expandEachRows(xml, lists){
  return xml.replace(/<w:tr[ >][\s\S]*?<\/w:tr>/g, row=>{
    const m=row.match(/\{\{\s*#each\s+([\w]+)\s*\}\}/);
    if(!m) return row;
    const name=m[1];
    const proto=row.replace(/\{\{\s*#each\s+[\w]+\s*\}\}/g,"");
    const recs=(lists && lists[name]) || [];
    if(!recs.length){
      const blank={};
      (proto.match(/\{\{\s*([\w]+)\.([\w]+)\s*\}\}/g)||[]).forEach(t=>{
        const f=t.replace(/[{}\s]/g,""); blank[f]="—";
      });
      return fillDocxXml(proto, blank, new Set());
    }
    return recs.map(rec=>{
      const map={};
      for(const k of Object.keys(rec)) map[name+"."+k]=rec[k];
      return fillDocxXml(proto, map, new Set());
    }).join("");
  });
}

async function fillDocx(b64, map, lists){
  if(typeof JSZip==="undefined") throw new Error("The document library didn't load — check your internet connection and reload.");
  const zip=await JSZip.loadAsync(b64,{base64:true});
  const parts=Object.keys(zip.files).filter(n=>/^word\/(document|header\d*|footer\d*)\.xml$/.test(n));
  if(!parts.length) throw new Error("That doesn't look like a Word .docx file.");
  const missing=new Set();
  for(const n of parts){
    let xml=await zip.file(n).async("string");
    if(lists) xml=expandEachRows(xml, lists);
    zip.file(n, fillDocxXml(xml, map, missing));
  }
  /* DEFLATE, or the .docx comes out ~20x larger than the template it came from */
  const blob=await zip.generateAsync({type:"blob", compression:"DEFLATE", compressionOptions:{level:6},
    mimeType:"application/vnd.openxmlformats-officedocument.wordprocessingml.document"});
  return {blob, missing:[...missing]};
}


/* ---------------------------------------------------------------------------
   Adopt a template that is already in the Drive folder.

   Uploading through the button writes a pointer into T.templates. A file put
   into the folder by hand writes nothing, so the tool could not see it. This
   looks for the filename the slot expects and adopts it — which is what
   someone who has just dragged a .docx into the folder expects to happen.
   ------------------------------------------------------------------------- */
let _tplLookedFor = {};
function adoptTemplate(kind, loud){
  if(!window.GSync || !GSync.ready() || !GSync.findNamed){
    if(loud) alert("Connect Google Drive first, then try again.");
    return;
  }
  if(tplRec(kind)){ if(loud) alert("That slot already has a template."); return; }
  /* A slot that was deliberately emptied carries a removal tombstone. Silently
     re-adopting the file would undo that decision — and, because the record
     then syncs, undo it on the other device too. Only an explicit "Look in
     Drive" may bring it back. */
  const rec=templates()[kind];
  if(rec && rec.removed && !loud) return;
  if(rec && rec.removed && loud &&
     !confirm("This template was removed. Look for it in Drive and put it back?")) return;
  const want=tplName(kind);
  if(!loud && _tplLookedFor[kind]) return;      /* once per session unless asked */
  _tplLookedFor[kind]=true;
  GSync.findNamed(want,(e,found)=>{
    if(e){ if(loud) alert("Couldn't search your Drive folder:\n\n"+e); return; }
    if(!found){
      if(loud) alert("No file called\n\n    "+want+"\n\nin your “"+GSync.folderName()
        +"” Drive folder.\n\nEither rename the file to exactly that, or use Upload "
        +"and pick it from your computer.");
      return;
    }
    templates()[kind]={ name:found.name, driveName:found.name, fileId:found.id,
                        modifiedTime:found.modifiedTime, at:new Date().toISOString(), size:0,
                        adopted:true };
    save(); render();
    const note=document.getElementById("savenote");
    if(note) note.textContent="found "+found.name+" in Drive";
    if(loud) alert("Found "+found.name+" in your Drive folder — the slot is filled.");
  });
}
function adoptAllTemplates(){ for(const [k] of DOCTYPES) if(!tplRec(k)) adoptTemplate(k,false); }

function uploadTemplate(kind, ev){
  const f=ev.target.files[0]; ev.target.value="";
  if(!f) return;
  if(!/\.docx$/i.test(f.name)){ alert("Please choose a .docx file (not .doc or .dotx)."); return; }
  const rd=new FileReader();
  rd.onload=()=>{
    const b64=String(rd.result).split(",")[1];
    const name=tplName(kind);
    if(!window.GSync||!GSync.ready()){
      alert("Connect Google Drive first — templates are stored in your “"
        +(window.GSync?GSync.folderName():"Section H Tools")+"” folder so every device can use them.");
      return;
    }
    const note=document.getElementById("savenote");
    if(note) note.textContent="uploading template…";
    GSync.putFile(name, b64, DOCX_MIME, (e,meta)=>{
      if(e){ alert("Couldn't upload the template to Google Drive:\n\n"+e); if(note) note.textContent=""; return; }
      templates()[kind]={ name:f.name, driveName:meta.name||name, fileId:meta.id,
                          modifiedTime:meta.modifiedTime, at:new Date().toISOString(), size:f.size };
      tplCachePut(meta.id, meta.modifiedTime, b64);      /* usable offline immediately */
      save(); render();
      if(note) note.textContent="template saved to Drive "+new Date().toLocaleTimeString();
    });
  };
  rd.readAsDataURL(f);
}
function removeTemplate(kind){
  const t=tplRec(kind); if(!t) return;
  if(!confirm("Remove this template?\n\nThe .docx in your Google Drive folder is moved to the Drive bin — you can restore it there.")) return;
  if(t.fileId && window.GSync && GSync.ready()) GSync.trashFile(t.fileId);
  if(t.fileId) { try{ localStorage.removeItem(tplCacheKey(t.fileId)); }catch(e){} }
  /* a removal must out-date the copy on the other device, or the next
     merge quietly restores it — so leave a stamped tombstone behind */
  templates()[kind]={removed:true, at:new Date().toISOString()};
  save(); render();
}

async function generateDoc(kind){
  const p=curProj();
  if(!p) return alert("Select a project first.");
  if(!tplRec(kind)) return alert("Upload a "+tplLabel(kind).toLowerCase()+" template first.");
  const stage=document.getElementById("docStage").value;
  const date =document.getElementById("docDate").value||todayISO();
  const noEl =document.getElementById("docNo");
  const no   =noEl? noEl.value.trim() : "";
  const due  =addDays(date, Number(biz().terms)||14);
  const map  =docFields(p,stage,{no,date,due});
  try{
    const bytes=await tplBytes(kind);
    const {blob,missing}=await fillDocx(bytes,map);
    const base=(kind==="invoice"? (no||"invoice") : "fee-proposal")+"_"+(p.job||"project");
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
    a.download=base.replace(/[^\w.-]+/g,"-")+".docx";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),3000);

    if(!p.docs) p.docs=[];
    p.docs.push({kind,stage,no,date,ex:stageAmountEx(p,stage),at:new Date().toISOString()});
    p.updatedAt=new Date().toISOString(); save(); render();

    if(missing.length) setTimeout(()=>alert("Generated — but these placeholders in your template aren't fields I know:\n\n"
      +missing.map(k=>"{{"+k+"}}").join("\n")+"\n\nThey were left as-is. Check the field list for the right names."),300);
  }catch(e){ alert("Couldn't generate the document:\n\n"+e.message); }
}

<script>
/* ==================== PART 13 DATA TOOL (1) ==================== */

"use strict";
/* ============================================================
   STORE — every cell keyed; {v: value, st: none|doc|conf|assum|calc}
   ============================================================ */
let S = { vals:{}, coll:{ rl:[], gl:[], rooms:[], lts:[], walls:[] }, seq:1, page:"project", eePack:null };
function p13EnsureShape(){ if(!S.coll) S.coll={};
  /* derive from the sections themselves — a new section with a collection
     must not need this list edited too */
  const need=["rl","gl","rooms","lts","walls"];
  try{ for(const sec of SEC) if(sec.coll&&sec.coll.id) need.push(sec.coll.id); }catch(e){}
  for(const k of need){ if(!Array.isArray(S.coll[k])) S.coll[k]=[]; }
  if(!S.page) S.page="project"; if(!("eePack" in S)) S.eePack=null; if(!S.seq) S.seq=1;
  if(!S.valTombs) S.valTombs={}; if(!S.collTombs) S.collTombs={};
}

/* ------------------------------------------------------------------
   STORE — owned by the suite shell. `S` is a live pointer into the
   current project's `p13` block, so every getV/setV/calc below works
   unchanged; there are no separate "slots" and no handoff any more.
   ------------------------------------------------------------------ */
function p13Save(){ if(window.SUITE) SUITE.saveP13(); }
function p13Bind(block){ S = block; p13EnsureShape(); }
function renderSlots(){}
function switchSlotUI(){}
function p13Note(t){ const el=document.getElementById("p13savenote"); if(el) el.textContent=t; }
/* the same datum can now appear in two sections at once — keep every
   input bound to a key in step without a full re-render stealing focus */
function syncMirrors(key,val,src){
  document.querySelectorAll('[data-key="'+key.replace(/[^\w.-]/g,"")+'"]').forEach(el=>{
    if(el===src) return;
    if(el.value!==val) el.value=val;
  });
}

function getV(k){ const c=S.vals[k]; return (c && c.v!=="" && c.v!=null) ? c.v : null; }
function getSt(k){ return (S.vals[k]&&S.vals[k].st)||"none"; }
/* Every cell carries its own `at`. Without it the whole p13 block had to
   merge as one record, so a single newer block on Drive replaced every
   value typed here — the reported data loss. */
function p13Now(){ return new Date().toISOString(); }
function p13Tomb(k){ if(!S.valTombs) S.valTombs={}; S.valTombs[k]=p13Now(); }
function dropV(k){ if(S.vals[k]!==undefined){ delete S.vals[k]; p13Tomb(k); } }
function setV(k,v,st){
  if(v===""||v==null){ dropV(k); }
  else { S.vals[k]={v:v,st:st,at:p13Now()}; if(S.valTombs) delete S.valTombs[k]; }
  p13Save();
}

    if(cz==="1"){
      const two=/two|2/i.test(String(getV("G9")||""));
      cand=cand.filter(r=>r.st===(two?"two+":"single"));
      why=two? "two or more storey dwelling" : "single storey dwelling";
    } else if(cand.length>1){
      const dir=t1323vFlow(cz, getV("G4"));
      why="heat flow "+String(dir||"").toLowerCase()+" (Table 13.2.3v p."+T_1323v.p+")";
      if(/and/i.test(String(dir||""))){
        /* "Down and up" — both directions apply, so the higher value governs */
        const vals=cand.map(r=>r.x[ci]).filter(v=>v!=null);
        if(!vals.length) return {v:"X — not permitted",cls:"err",
          note:"Table 13.2.3x shows X for a sandwich-panel roof at SA "+SA+" in climate zone "+cz
            +". A lighter panel finish is required. [Table 13.2.3x p."+T_1323x.p+"]"};
        const gov=Math.max.apply(null,vals);
        return {v:"Total R"+gov.toFixed(2),cls:"ok",
          note:"Minimum Total R-Value for the sandwich panel — 13.2.3(9).\n"
            +"Table 13.2.3v gives \"down and up\" for this zone, so BOTH directions apply and the higher value "
            +"governs (down "+cand.filter(r=>r.d==="Down").map(r=>r.x[ci]).join("")+", up "
            +cand.filter(r=>r.d==="Up").map(r=>r.x[ci]).join("")+").\n"
            +"A sandwich-panel roof is assessed on this Total R-Value instead of the ceiling insulation tables, and "
            +"is exempt from the 13.2.3(7) thermal break.\n[Table 13.2.3x p."+T_1323x.p+" · "+why+"]"};
      }
      cand=cand.filter(r=>r.d===dir);
    }
    if(!cand.length) return {v:"",cls:"err",
      note:"No row in Table 13.2.3x for climate zone "+cz+(why? " ("+why+")" : "")+"."};
    const val=cand[0].x[ci];
    if(val==null) return {v:"X — not permitted",cls:"err",
      note:"Table 13.2.3x shows X for a sandwich-panel roof at SA "+SA+" in climate zone "+cz
        +". Specify a lighter panel finish, or use a different roof construction. [Table 13.2.3x p."+T_1323x.p+"]"};
    return {v:"Total R"+val.toFixed(2),cls:"ok",
      note:"Minimum Total R-Value for the sandwich panel — 13.2.3(9). A sandwich-panel roof is assessed on this "
        +"Total R-Value instead of the ceiling insulation tables, and is exempt from the 13.2.3(7) thermal break.\n"
        +"[Table 13.2.3x p."+T_1323x.p+" · climate zone "+cz+(why? " · "+why : "")+" · SA "+SA+"]"};
  },
  calc_roofBreak(){ const m=need(["R2","R8","R9"]); if(m.length) return {v:"",cls:"err",note:"Missing: "+m.join(", ")};
  if(getV("R2")==="sandwich panel") return {v:"n/a",cls:"ok",note:"Sandwich panel exempt — use Table 13.2.3x Total R."};
  const req = getV("R2")==="metal sheet" && getV("R8")==="metal" && getV("R9")===true;
  return {v: req?"YES — R ≥ 0.2":"not required", cls: req?"":"ok", note: req?"Thermal break R≥0.2 between metal sheet and metal purlins/rafters/battens.":""+unconf(["R2","R8","R9"])}; },
calc_penUplift(){
    /* the explanation matters more than the number here — "uplift" is not
       a term the NCC uses, so it needs saying plainly */
    const _r = (function(){ const p=getV("R10"); if(p==null) return {v:"",cls:"err",note:"Missing: R10 penetration %"};
  if(p<0.5) return {v:"no uplift",cls:"ok",note:"<0.5% uninsulated — Table 13.2.3w not triggered."};
  if(p>=5) return {v:"X",cls:"err",note:"≥5% uninsulated not permitted — reduce penetrations."};
  return {v:"uplift req.",cls:"",note:"Apply Table 13.2.3w row "+p+"% to base ceiling R once C_RC1 resolved."}; 
    })();
    const why = "WHAT THIS IS: downlights, exhaust fans and similar openings leave patches of ceiling with no insulation over them. Heat escapes through those gaps far faster than through the insulated area, so the average performance of the ceiling drops. Table 13.2.3w compensates by RAISING the R-Value required over the remaining insulated area — the \"uplift\" — so the ceiling as a whole still performs as intended.\nThe uplift is keyed on the percentage of ceiling area left uninsulated: the more holes, the higher the required R-Value, and past a point the table shows X because no amount of insulation elsewhere can make up for it.\nSealed IC-4 rated fittings that may be covered with insulation do not count as uninsulated area, which is usually the cheapest way to avoid the uplift altogether.";
    if(!_r || _r.v==null) return _r;
    return {v:_r.v, cls:_r.cls, note:(_r.note? _r.note+"\n\n" : "")+why};
  },
calc_foilRoof(){ const cz=getV("G3"); if(!cz) return {v:"",cls:"err",note:"Missing: G3"};

  return {v: warm?"recommended":"optional", cls:"", note:(warm?"CZ"+cz+": under-roof reflective insulation substantially reduces required bulk R (see 'Yes' rows, Tables 13.2.3a–m).":"Cooler zone — bulk R dominates.")+" Spec: emittance ≤0.05, ≥20 mm airspace"+(Number(cz)>=3?", downward-facing":"")+"."}; },
calc_roofSA(){ const m=need(["G3","R3"]); if(m.length) return {v:"",cls:"err",note:"Missing: "+m.join(", ")};

calc_rooflights(){ if(getV("G2")==="NSW") return {v:"n/a (NSW)",cls:"ok",note:"13.2.4 deleted in NSW (BASIX)."};
  const rows=S.coll.rl; if(!rows.length) return {v:"none",cls:"ok",note:"No roof lights entered."};
  let out=[],bad=false;
