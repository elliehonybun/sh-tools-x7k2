<style>
  :root{
    --red:#dc2626; --red-bg:#fee2e2;
    --blue:#2563eb; --blue-bg:#dbeafe;
    --green:#16a34a; --green-bg:#dcfce7;
    --purple:#7c3aed; --purple-bg:#ede9fe;
    --orange:#ea580c; --orange-bg:#ffedd5;
    --ink:#1f2937; --muted:#6b7280; --line:#e5e7eb; --card:#ffffff; --bg:#f3f4f6;
  }
  *{box-sizing:border-box}
  body{font-family:"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink);margin:0;padding:0 0 80px}
  header{position:sticky;top:0;z-index:50;background:#111827;color:#fff;padding:10px 20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
  header h1{font-size:15px;margin:0;font-weight:600;flex:1;min-width:260px}
  .counts{display:flex;gap:6px;flex-wrap:wrap}
  .pill{border-radius:20px;padding:2px 10px;font-size:11px;font-weight:600;color:#fff}
  .pill.red{background:var(--red)} .pill.blue{background:var(--blue)} .pill.green{background:var(--green)} .pill.purple{background:var(--purple)} .pill.orange{background:var(--orange)} .pill.grey{background:#4b5563}
  header button{background:#374151;color:#fff;border:1px solid #4b5563;border-radius:6px;padding:5px 10px;font-size:12px;cursor:pointer}
  header button:hover{background:#4b5563}
  #pagenav{max-width:1180px;margin:14px auto 0;padding:0 16px;display:flex;gap:8px}
  #pagenav button{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:8px 8px 0 0;padding:8px 18px;font-size:13px;font-weight:700;cursor:pointer;color:var(--muted)}
  #pagenav button.active{background:#111827;color:#fff;border-color:#111827}
  main{max-width:1180px;margin:18px auto;padding:0 16px}
  section.card{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:18px;overflow:hidden}
  .sec-head{padding:10px 16px;background:#f9fafb;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .sec-head h2{font-size:14px;margin:0;flex:1}
  .sec-body{padding:8px 16px 16px}
  .banner{background:#fef9c3;border:1px solid #fde047;color:#854d0e;font-size:12px;padding:6px 10px;border-radius:6px;margin:8px 0}
  table.grid{width:100%;border-collapse:collapse;font-size:12.5px}
  table.grid th{font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
  table.grid td{padding:5px 6px;border-bottom:1px solid #f1f5f9;vertical-align:middle}
  .cell input,.cell select{width:100%;padding:5px 7px;border-radius:6px;border:1.5px solid var(--line);font-size:12.5px;background:#fff}
  .cell input[disabled]{background:#f3f4f6;color:#374151;font-weight:600}
  .chip{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:10px;white-space:nowrap}
  .chip.ok{background:var(--green-bg);color:var(--green)}
  .chip.warn{background:var(--orange-bg);color:var(--orange)}
  .chip.late{background:var(--red-bg);color:var(--red)}
  .chip.info{background:var(--blue-bg);color:var(--blue)}
  .chip.done{background:#e5e7eb;color:#4b5563}
  .abtn{border:1px solid var(--line);background:#fff;border-radius:6px;padding:3px 8px;font-size:11px;cursor:pointer;margin-right:4px}
  .abtn.confirm{color:var(--green);border-color:var(--green)}
  .abtn.confirm:hover{background:var(--green-bg)}
  .abtn.del{color:var(--red)}
  .abtn.hold{color:var(--orange);border-color:var(--orange)}
  .cbtn{background:var(--orange);color:#fff;border:none;border-radius:6px;padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer}
  .cbtn:hover{filter:brightness(1.1)}
  .addrow{border:1px dashed var(--blue);color:var(--blue);background:#fff;border-radius:6px;padding:4px 10px;font-size:11.5px;cursor:pointer}
  .fee-line{display:flex;justify-content:space-between;font-size:12.5px;padding:4px 2px;border-bottom:1px solid #f1f5f9}
  .fee-line b{font-variant-numeric:tabular-nums}
  .statbox{display:inline-block;vertical-align:top;border:1px solid var(--line);border-radius:8px;padding:10px 16px;margin:6px 10px 6px 0;background:#fff;min-width:215px}
  .statbox .lbl{font-size:11px;text-transform:uppercase;color:var(--muted);letter-spacing:.03em}
  .statbox .val{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
  .statbox .sub{font-size:11px;color:var(--muted)}
  tr.clickable{cursor:pointer}
  tr.clickable:hover td{background:#f8fafc}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}
  .cal .dow{font-size:10.5px;text-transform:uppercase;color:var(--muted);font-weight:700;text-align:center;padding:2px}
  .cal .day{min-height:92px;border:1px solid var(--line);border-radius:6px;padding:4px;font-size:11px;background:#fff;overflow:hidden}
  .cal .day.other{background:#f8fafc}
  .cal .day.today{outline:2px solid var(--blue)}
  .cal .dn{color:var(--muted);font-weight:700;font-size:10.5px}
  .cal .evt{display:block;margin:2px 0;padding:2px 4px;border-radius:4px;background:var(--blue-bg);color:var(--blue);cursor:pointer;font-size:10px;line-height:1.25;border:none;text-align:left;width:100%}
  .cal .evt.pay{background:var(--green-bg);color:var(--green);font-weight:700}
  .cal .evt.late{background:var(--red-bg);color:var(--red)}
  footer{position:fixed;bottom:0;left:0;right:0;background:#111827;color:#9ca3af;font-size:11px;padding:6px 20px;display:flex;justify-content:space-between}
</style>

<body>
<header>
  <h1>Project Tracker <span style="font-weight:400;color:#9ca3af">Roster · Fee stages · Projection · Calendar (FY <span id="fyLbl"></span>)</span></h1>
  <div class="counts" id="counts"></div>
  <button onclick="exportJSON()">Export JSON</button>
  <button onclick="document.getElementById('importFile').click()">Import</button>
  <input type="file" id="importFile" accept=".json" style="display:none" onchange="importJSON(event)">
  <button onclick="window.open('Part13_Data_Tool_v2.html','_blank')" title="Opens the Project Data Tool (same folder)">Open Project Data Tool</button>
</header>
<nav id="pagenav"></nav>
<main><div id="app"></div></main>
<footer>
  <span>Companion to Project Data Tool (Part13_Data_Tool_v2.html) · fees ex-GST unless marked · GST 10%</span>
  <span id="savenote"></span>
</footer>

<script src="gdrive-sync.js"></script>
<script>
"use strict";
/* ============================ STORE ============================ */
let T={ projects:[], seq:1, page:"data", cur:null, goal:2500, calYM:null, costs:[], tombs:{} };
const STKEY="project_tracker_v1";

/* ---- ids -------------------------------------------------------------
   Ids used to come from a per-device counter (String(T.seq++)), so the
   desktop and the iPad both minted "5" for different projects — which makes
   them impossible to merge. Ids are now collision-proof. Old numeric ids are
   migrated ONCE, derived from the job number (or a content hash) so BOTH
   devices independently arrive at the same new id for the same record. */
function uid(){ return window.GSync? GSync.newId() : Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,8); }
function hash32(s){ let h=5381; for(let i=0;i<s.length;i++) h=((h<<5)+h+s.charCodeAt(i))>>>0; return h.toString(36); }
function migrateIds(){
  const old=/^\d+$/, used={}, remap={};
  const assign=(rec,prefix,natural)=>{
    const bare=JSON.stringify(Object.assign({},rec,{id:0,updatedAt:0}));
    let base = (natural&&String(natural).trim())
      ? prefix+"_"+String(natural).trim().toLowerCase().replace(/\s+/g,"")
      : prefix+"_h"+hash32(bare);
    let id=base,n=2; while(used[id]) id=base+"_"+(n++);
    used[id]=1; return id;
  };
  let changed=false;
  for(const p of T.projects){ if(p&&old.test(String(p.id))){ const nid=assign(p,"p",p.job); remap[p.id]=nid; p.id=nid; changed=true; } else if(p) used[p.id]=1; }
  for(const c of T.costs){ if(c&&old.test(String(c.id))){ c.id=assign(c,"c",""); changed=true; } else if(c) used[c.id]=1; }
  if(T.cur&&remap[T.cur]) T.cur=remap[T.cur];
  return changed;
}

/* ---- change stamping -------------------------------------------------
   Every save diffs each record against how it looked at the last save and
   stamps only what actually changed. That keeps merge decisions honest —
   opening the tracker doesn't make this device "win" every project. */
let _sig={};
function baseline(){ _sig={}; stampChanges(true); }
function stampChanges(quiet){
  const now=new Date().toISOString(), seen={};
  for(const arr of [T.projects,T.costs]){
    for(const r of (arr||[])){
      if(!r||r.id==null) continue;
      const bare=JSON.stringify(Object.assign({},r,{updatedAt:0}));
      seen[r.id]=bare;
      if(!quiet && _sig[r.id]!==undefined && _sig[r.id]!==bare) r.updatedAt=now;
      if(!quiet && _sig[r.id]===undefined && Object.keys(_sig).length) r.updatedAt=r.updatedAt||now;
    }
  }
  const setSig=JSON.stringify({goal:T.goal,page:T.page,cur:T.cur,calYM:T.calYM});
  if(!quiet && _sig.__set!==undefined && _sig.__set!==setSig) T.settingsAt=now;
  seen.__set=setSig;
  _sig=seen;
}
/* deletion tombstones — so a delete here isn't undone by a device that still has it */
function tombstone(id){ if(!T.tombs) T.tombs={}; T.tombs[id]=new Date().toISOString(); }

function save(){ stampChanges();
  try{ localStorage.setItem(STKEY,JSON.stringify(T)); note("saved "+new Date().toLocaleTimeString()); }catch(e){ note("autosave unavailable — use Export"); }
  if(window.GSync) GSync.touch(); }
function ensureShape(){ if(!T.projects) T.projects=[]; if(!T.page) T.page="data"; if(!T.seq) T.seq=1; if(!(Number(T.goal)>0)) T.goal=2500; if(!T.calYM) T.calYM=todayISO().slice(0,7); if(!T.costs) T.costs=[]; if(!T.tombs) T.tombs={}; }
function load(){ try{ const x=localStorage.getItem(STKEY); if(x) T=JSON.parse(x); }catch(e){} ensureShape();
  if(migrateIds()){ try{ localStorage.setItem(STKEY,JSON.stringify(T)); }catch(e){} }
  baseline(); }
function note(t){ document.getElementById("savenote").textContent=t; }

/* ============================ CONSTANTS ============================ */
const JOBTYPES=["NatHERS","Part H6","WSUD","Section J","Sustainable feasibility"];
const COMPLEXITY=["Low","Medium","High"];
const GST=0.10, PRELIM=0.70;
const STATUSES=[
 {id:"AFP",  l:"Awaiting Fee Proposal",                           days:5,  act:"Issue Fee Proposal"},
 {id:"AFA",  l:"Awaiting Fee Acceptance",                         days:14, act:"Follow up client"},
 {id:"ACC",  l:"Accepted Fee",                                    days:14, act:"Preliminary Report Due"},
 {id:"INVP", l:"Invoiced Preliminary",                            days:7,  act:"Follow up client"},
 {id:"PAIDP",l:"Preliminary Invoice Paid (Awaiting Finalisation)",days:28, act:"Awaiting Finalisation"},
 {id:"INVF", l:"Invoiced Finalisation",                           days:7,  act:"Follow up client"},
 {id:"PAIDF",l:"Final Invoice Paid",                              days:7,  act:"Final Report Due"},
 {id:"DONE", l:"Final Reports Issued (Project Complete)",         days:null,act:"No further action — complete"},
 {id:"ADJ",  l:"Adjustment Invoiced",                             days:14, act:"Adjusted Report Due"}
];
const ST=Object.fromEntries(STATUSES.map(s=>[s.id,s]));

/* ============================ DATES ============================ */
function todayISO(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function pd(iso){ const [y,m,d]=iso.split("-").map(Number); return new Date(y,m-1,d); }
function iso(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function addDays(isoD,n){ const d=pd(isoD); d.setDate(d.getDate()+n); return iso(d); }
function dmy(isoD){ if(!isoD) return "—"; const [y,m,d]=isoD.split("-"); return d+"/"+m+"/"+y; }
function daysBetween(a,b){ return Math.round((pd(b)-pd(a))/86400000); }
function fyStartISO(){ const d=new Date(); const y=(d.getMonth()>=6)?d.getFullYear():d.getFullYear()-1; return y+"-07-01"; }
function fyEndISO(){ const s=pd(fyStartISO()); return (s.getFullYear()+1)+"-06-30"; }

/* ============================ PROJECT HELPERS ============================ */
function newProject(){ const p={id:uid(), updatedAt:new Date().toISOString(), job:"",addr:"",client:"",designer:"",type:"",dwell:"",cx:"",fee:"",pfee:"",adj:"",hold:false,log:[]}; T.projects.push(p); T.cur=p.id; T.page="data"; save(); render(); }
function delProject(id){ if(!confirm("Delete this project and its timeline?")) return; T.projects=T.projects.filter(p=>p.id!==id); tombstone(id); if(T.cur===id) T.cur=null; save(); render(); }
function proj(id){ return T.projects.find(p=>p.id===id); }
function curProj(){ return T.cur? proj(T.cur) : null; }
function toggleHold(){ const p=curProj(); if(!p) return; p.hold=!p.hold; save(); render(); }
function sortedLog(p){ return p.log.slice().sort((a,b)=> a.d===b.d ? (a.i||0)-(b.i||0) : (a.d<b.d?-1:1)); }
function curStatus(p){ const l=sortedLog(p); return l.length? l[l.length-1] : null; }
function deadlineOf(p){ if(p.hold) return null; const c=curStatus(p); if(!c) return null; const s=ST[c.st]; if(!s||s.days==null) return null; return {due:addDays(c.d,s.days), act:s.act, days:s.days}; }
function fee(p){ const f=Number(p.fee); return isFinite(f)?f:0; }
function pfeeEx(p){ const x=Number(p.pfee); return (isFinite(x)&&x>0)? x : fee(p)*PRELIM; }
function ffeeEx(p){ return Math.max(fee(p)-pfeeEx(p),0); }
function adjFee(p){ const f=Number(p.adj); return isFinite(f)?f:0; }
function money(x){ return "$"+Math.round(x).toLocaleString("en-AU"); }
function money2(x){ return "$"+x.toLocaleString("en-AU",{minimumFractionDigits:2,maximumFractionDigits:2}); }
function projHours(p){ return (p.log||[]).reduce((a,e)=>a+(Number(e.h)||0),0); }
function projPaid(p){ let v=0; for(const e of (p.log||[])){ if(e.st==="PAIDP") v+=pfeeEx(p); if(e.st==="PAIDF") v+=ffeeEx(p); } return v; }
function rateOf(v,h){ return h>0? v/h : null; }
function rateTxt(v,h){ const r=rateOf(v,h); return r==null? "—" : money(r)+"/hr"; }
function hTxt(h){ return h? String(Number(h.toFixed(2))) : "—"; }
function fyHours(){ const a=fyStartISO(), b=fyEndISO(); let h=0;
  for(const p of T.projects) for(const e of (p.log||[])) if(e.d>=a&&e.d<=b) h+=Number(e.h)||0;
  return h; }
function lastEvent(p,ids){ const l=sortedLog(p).filter(e=>ids.includes(e.st)); return l.length?l[l.length-1]:null; }
function hasAccepted(p){ return p.log.some(e=>["ACC","INVP","PAIDP","INVF","PAIDF","DONE","ADJ"].includes(e.st)); }

function pendingValue(p){ const c=curStatus(p); const f=fee(p);
  if(!c) return {v:f, l:"full fee (pipeline)"};
  switch(c.st){
    case "AFP": case "AFA": return {v:f, l:"full fee (pipeline)"};
    case "ACC": return {v:f, l:"full fee (accepted)"};
    case "INVP": return {v:pfeeEx(p), l:"prelim invoice outstanding"};
    case "PAIDP": return {v:ffeeEx(p), l:"final stage remaining"};
    case "INVF": return {v:ffeeEx(p), l:"final invoice outstanding"};
    case "PAIDF": return {v:adjFee(p), l: adjFee(p)?"adjustment (unbilled)":"fully invoiced & paid"};
    case "DONE": return {v:0, l:"complete"};
    case "ADJ": return {v:adjFee(p), l:"adjustment invoice outstanding"};
  }
  return {v:0,l:""};
}

/* actual money received (ex GST) */
function payments(){
  const out=[];
  for(const p of T.projects){
    for(const e of p.log){
      if(e.st==="PAIDP") out.push({d:e.d, job:p.job||("#"+p.id), id:p.id, client:p.client, stage:"Preliminary", v:pfeeEx(p)});
      if(e.st==="PAIDF") out.push({d:e.d, job:p.job||("#"+p.id), id:p.id, client:p.client, stage:"Final", v:ffeeEx(p)});
    }
  }
  return out.sort((a,b)=>a.d<b.d?-1:1);
}

/* expected FUTURE receipts (ex GST) — only jobs with an accepted fee, not on hold.
   Prelim expected: INVP date+7, else ACC date+21 (14 d report + 7 d payment).
   Final expected: INVF date+7, else PAIDP date+35 (28 d finalisation + 7 d payment), else prelim-expected+35.
   Adjustment expected: ADJ date+14. Past-due expectations roll forward to today+7. */
function expectedReceipts(){
  const out=[]; const today=todayISO();
  for(const p of T.projects){
    if(p.hold||!hasAccepted(p)) continue;
    const cs=curStatus(p); if(!cs||cs.st==="DONE") { /* complete: no further projections except unpaid adj */ }
    const paidP=lastEvent(p,["PAIDP"]), paidF=lastEvent(p,["PAIDF"]);
    const done=cs&&cs.st==="DONE";
    let prelimDate=null;
    if(!paidP&&!paidF&&!done&&fee(p)>0){
      const invp=lastEvent(p,["INVP"]), acc=lastEvent(p,["ACC"]);
      if(invp) prelimDate=addDays(invp.d,7); else if(acc) prelimDate=addDays(acc.d,21);
      if(prelimDate&&prelimDate<today) prelimDate=addDays(today,7);
      if(prelimDate) out.push({d:prelimDate, job:p.job||("#"+p.id), id:p.id, stage:"Preliminary (expected)", v:pfeeEx(p)});
    }
    if(!paidF&&!done&&fee(p)>0){
      const invf=lastEvent(p,["INVF"]);
      let finDate=null;
      if(invf) finDate=addDays(invf.d,7);
      else if(paidP) finDate=addDays(paidP.d,35);
      else if(prelimDate) finDate=addDays(prelimDate,35);
      if(finDate&&finDate<today) finDate=addDays(today,7);
      if(finDate) out.push({d:finDate, job:p.job||("#"+p.id), id:p.id, stage:"Final (expected)", v:ffeeEx(p)});
    }
    const adj=lastEvent(p,["ADJ"]);
    if(adj&&adjFee(p)>0){
      let ad=addDays(adj.d,14); if(ad<today) ad=addDays(today,7);
      out.push({d:ad, job:p.job||("#"+p.id), id:p.id, stage:"Adjustment (expected)", v:adjFee(p)});
    }
  }
  return out.sort((a,b)=>a.d<b.d?-1:1);
}

/* 2026-27 resident income tax + 2% Medicare levy (no offsets/deductions/LITO) */
function incomeTax(x){
  const b=[[18200,0],[45000,.15],[135000,.30],[190000,.37],[Infinity,.45]];
  let t=0,lo=0;
  for(const [hi,r] of b){ if(x>lo) t+=(Math.min(x,hi)-lo)*r; lo=hi; if(x<=hi) break; }
  return t + Math.max(0,x)*0.02;
}

/* ============================ FY SERIES ============================ */
function fySeries(){
  const start=fyStartISO(), end=fyEndISO(), today=todayISO();
  const nDays=daysBetween(start,end)+1;
  const elapsed=Math.max(1,Math.min(daysBetween(start,today)+1,nDays));
  const dailyPaid=new Array(nDays).fill(0), dailyExp=new Array(nDays).fill(0), dailyCost=new Array(nDays).fill(0);
  for(const x of payments()){ const i=daysBetween(start,x.d); if(i>=0&&i<nDays) dailyPaid[i]+=x.v; }
  for(const x of expectedReceipts()){ const i=daysBetween(start,x.d); if(i>=0&&i<nDays) dailyExp[i]+=x.v; }
  for(const x of costOccurrences(start,end)){ const i=daysBetween(start,x.d); if(i>=0&&i<nDays) dailyCost[i]+=x.v; }
  const cumPaid=[],cumExp=[],cumCost=[]; let a=0,b=0,cc=0;
  for(let i=0;i<nDays;i++){ a+=dailyPaid[i]; b+=dailyPaid[i]+dailyExp[i]; cc+=dailyCost[i]; cumPaid.push(a); cumExp.push(b); cumCost.push(cc); }
  const toDate=cumPaid[elapsed-1];
  const avgPerDay=toDate/elapsed;
  const rollFY=avgPerDay*nDays;
  const expFY=cumExp[nDays-1];
  const projFY=Math.max(rollFY,expFY);
  const costToDate=cumCost[elapsed-1], costFY=cumCost[nDays-1];
  const profitToDate=toDate-costToDate, profitFY=projFY-costFY;
  return {start,end,today,nDays,elapsed,cumPaid,cumExp,cumCost,toDate,avgPerDay,rollFY,expFY,projFY,costToDate,costFY,profitToDate,profitFY};
}
function monthPaid(y,m){ const pre=y+"-"+String(m).padStart(2,"0");
  return payments().filter(x=>x.d.startsWith(pre)).reduce((s,x)=>s+x.v,0); }

/* ============================ COSTS ============================ */
const COSTCATS=["Software / subscription","Equipment","Insurance","Registration / accreditation","Travel / vehicle","Office / utilities","Training","Other"];
const FREQS=["one-off","weekly","fortnightly","monthly","quarterly","yearly"];
function newCost(){ T.costs.push({id:uid(), updatedAt:new Date().toISOString(), desc:"", cat:"", amt:"", freq:"one-off", start:todayISO(), end:""}); save(); render(); }
function delCost(id){ T.costs=T.costs.filter(c=>c.id!==id); tombstone(id); save(); render(); }
function nextDate(d,freq){ const x=pd(d);
  if(freq==="weekly") x.setDate(x.getDate()+7);
  else if(freq==="fortnightly") x.setDate(x.getDate()+14);
  else if(freq==="monthly") x.setMonth(x.getMonth()+1);
  else if(freq==="quarterly") x.setMonth(x.getMonth()+3);
  else x.setFullYear(x.getFullYear()+1);
  return iso(x); }
function costOccurrences(a,b){ const out=[];
  for(const c of (T.costs||[])){ const amt=Number(c.amt)||0; if(!amt||!c.start) continue;
    if(!c.freq||c.freq==="one-off"){ if(c.start>=a&&c.start<=b) out.push({d:c.start,v:amt,desc:c.desc,cat:c.cat,id:c.id}); continue; }
    let d=c.start; const stop=(c.end&&c.end<b)? c.end : b; let g=0;
    while(d<=stop&&g++<1200){ if(d>=a) out.push({d,v:amt,desc:c.desc,cat:c.cat,id:c.id}); d=nextDate(d,c.freq); }
  }
  return out.sort((x,y)=>x.d<y.d?-1:1); }
function monthCost(y,m){ const dim=new Date(y,m,0).getDate(); const mm=String(m).padStart(2,"0");
  return costOccurrences(y+"-"+mm+"-01", y+"-"+mm+"-"+String(dim).padStart(2,"0")).reduce((a,x)=>a+x.v,0); }

function chipFor(p){
  if(p.hold) return '<span class="chip done">⏸ ON HOLD</span>';
  const c=curStatus(p);
  if(!c) return '<span class="chip info">NEW — no status logged</span>';
  if(c.st==="DONE") return '<span class="chip done">'+ST[c.st].l+'</span>';
  const dl=deadlineOf(p); if(!dl) return '<span class="chip info">'+ST[c.st].l+'</span>';
  const left=daysBetween(todayISO(),dl.due);
  const cls= left<0 ? "late" : left<=3 ? "warn" : "ok";
  return '<span class="chip '+cls+'">'+ST[c.st].l+'</span>';
}

function logStatus(){
  const p=curProj(); if(!p) return;
  const st=document.getElementById("stSel").value;
  const d=document.getElementById("stDate").value||todayISO();
  const hEl=document.getElementById("stHours");
  const hv=hEl? Number(hEl.value):0;
  const e={st,d,i:p.log.length};
  if(isFinite(hv)&&hv>0) e.h=hv;
  p.log.push(e);
  save(); render();
}
function delLog(sortedIdx){
  const p=curProj(); if(!p) return;
  const e=sortedLog(p)[sortedIdx];
  p.log=p.log.filter(x=>x!==e);
  save(); render();
}

/* ---------- tab 2: Project Roster ---------- */
function pageRoster(){
  const rows=T.projects.map(p=>{
    const c=curStatus(p), dl=deadlineOf(p);
    return {p,c,dl,left: dl? daysBetween(todayISO(),dl.due):null};
  }).sort((a,b)=>{
    const rank=r=> r.p.hold?2 : (r.c&&r.c.st==="DONE")?3 : r.dl?0:1;
    if(rank(a)!==rank(b)) return rank(a)-rank(b);
    if(a.dl&&b.dl) return a.dl.due<b.dl.due?-1:1;
    return 0;
  });
  let pipeline=0, overdue=0;
  let h='<section class="card"><div class="sec-head"><h2>Project Roster — deadlines, actions & fee stages</h2><button class="addrow" onclick="newProject()">+ new project</button></div><div class="sec-body">';
  if(!rows.length){ h+='<div class="banner">No projects yet — click “+ new project”.</div></div></section>'; return h; }
  h+='<table class="grid"><tr><th>Job #</th><th>Client</th><th>Address</th><th>Type</th><th>Dwl</th><th>Cx</th><th>Fee ex GST</th><th>Hrs</th><th>$/hr</th><th>Status</th><th>Since</th><th>Deadline</th><th>Action on deadline</th><th>Days</th><th>Next $ (ex GST)</th></tr>';
  for(const r of rows){
    const pv=pendingValue(r.p);
    if(!r.p.hold && !(r.c&&r.c.st==="DONE")) pipeline+=pv.v;
    let daysChip="—";
    if(r.p.hold) daysChip='<span class="chip done">⏸ hold</span>';
    else if(r.c&&r.c.st==="DONE") daysChip='<span class="chip done">complete</span>';
    else if(r.left!=null){
      const cls=r.left<0?"late":r.left<=3?"warn":"ok"; if(r.left<0) overdue++;
      daysChip='<span class="chip '+cls+'">'+(r.left<0?Math.abs(r.left)+" d OVERDUE":r.left+" d")+'</span>';
    }
    h+='<tr class="clickable" onclick="selectProj(\''+r.p.id+'\')">'
      +'<td><b>'+(r.p.job||"—")+'</b></td><td>'+(r.p.client||"—")+'</td><td style="font-size:11.5px">'+(r.p.addr||"—")+'</td><td>'+(r.p.type||"—")+'</td><td>'+(r.p.dwell||"—")+'</td><td>'+(r.p.cx||"—")+'</td>'
      +'<td>'+money(fee(r.p))+'</td>'
      +'<td>'+hTxt(projHours(r.p))+'</td>'
      +'<td>'+rateTxt(fee(r.p)+adjFee(r.p),projHours(r.p))+'</td>'
      +'<td style="font-size:11.5px">'+(r.p.hold?'⏸ On hold':(r.c?ST[r.c.st].l:"—"))+'</td>'
      +'<td>'+(r.c?dmy(r.c.d):"—")+'</td>'
      +'<td>'+(r.dl?dmy(r.dl.due):"—")+'</td>'
      +'<td style="font-size:11.5px">'+(r.dl?r.dl.act:(r.p.hold?"paused":(r.c&&r.c.st==="DONE"?"—":"log a status")))+'</td>'
      +'<td>'+daysChip+'</td>'
      +'<td title="'+pv.l+'">'+(pv.v?money(pv.v):"—")+'</td></tr>';
  }
  h+='</table><div style="font-size:12px;color:var(--muted);margin-top:8px">Pipeline / outstanding value (active, non-hold, ex GST): <b>'+money(pipeline)+'</b> · overdue actions: <b style="color:'+(overdue?"var(--red)":"var(--green)")+'">'+overdue+'</b> · click any row to open it in Project Data.</div>';
  h+='</div></section>';
  return h;
}

/* ---------- tab 3: Projection ---------- */
function pageIncome(){
  const s=fySeries();
  const goalFY=T.goal/7*s.nDays;
  const t=pd(todayISO());
  const thisY=t.getFullYear(), thisM=t.getMonth()+1;
  const lm=new Date(thisY,thisM-2,1);
  const paidThis=monthPaid(thisY,thisM), paidLast=monthPaid(lm.getFullYear(),lm.getMonth()+1);
  const costThis=monthCost(thisY,thisM), costLast=monthCost(lm.getFullYear(),lm.getMonth()+1);
  const dimThis=new Date(thisY,thisM,0).getDate(), dimLast=new Date(lm.getFullYear(),lm.getMonth()+1,0).getDate();
  const goalThis=T.goal/7*dimThis, goalLast=T.goal/7*dimLast;
  const delta=paidThis-paidLast;
  const remDays=Math.max(1,s.nDays-s.elapsed);
  const gap=goalFY-s.projFY;
  const needWeekly=gap>0? gap/(remDays/7) : 0;
  const tax1=incomeTax(s.toDate), tax2=incomeTax(s.projFY), taxG=incomeTax(goalFY);
  const mchip=(v,g)=> v>=g? '<span class="chip ok">over goal +'+money(v-g)+'</span>' : '<span class="chip late">under goal −'+money(g-v)+'</span>';

  let h='<section class="card"><div class="sec-head"><h2>Projection — FY '+fyStartISO().slice(0,4)+'/'+fyEndISO().slice(2,4)+' (all values ex GST)</h2>'
    +'<label style="font-size:12px;color:var(--muted)">weekly income goal $ <input type="number" step="50" data-goal="1" value="'+T.goal+'" style="width:90px;padding:5px;border-radius:6px;border:1.5px solid var(--line)"></label>'
    +'</div><div class="sec-body">'
    +'<canvas id="incChart" width="1100" height="430" style="width:100%;background:#fff;border:1px solid var(--line);border-radius:8px"></canvas>'
    +'<div style="font-size:11px;color:var(--muted);margin-top:4px">'
    +'— <span style="color:var(--green);font-weight:700">paid</span> (money actually received) · '
    +'<span style="color:var(--orange);font-weight:700">expected</span> (paid + scheduled invoicing from accepted jobs, by due month; on-hold jobs excluded) · '
    +'<span style="color:var(--blue);font-weight:700">projected</span> (greater of rolling FY average and the expected schedule) · '
    +'<span style="color:#6b7280;font-weight:700">goal</span> ($'+Number(T.goal).toLocaleString()+'/week ≈ '+money(goalFY)+'/yr) · '
    +'<span style="color:var(--red);font-weight:700">costs</span> (deductibles &amp; subscriptions, cumulative)</div>'

    +'<div style="margin-top:12px">'
    +'<div class="statbox"><div class="lbl">Income to date (paid, ex GST)</div><div class="val">'+money(s.toDate)+'</div><div class="sub">after tax ≈ '+money(s.toDate-tax1)+' (tax '+money(tax1)+')</div></div>'
    +'<div class="statbox"><div class="lbl">Expected FY (incl. future invoicing)</div><div class="val">'+money(s.expFY)+'</div><div class="sub">accepted jobs scheduled to month · ex GST</div></div>'
    +'<div class="statbox"><div class="lbl">Projected FY income</div><div class="val">'+money(s.projFY)+'</div><div class="sub">after tax ≈ '+money(s.projFY-tax2)+' (tax '+money(tax2)+')</div></div>'
    +'<div class="statbox"><div class="lbl">Goal FY income</div><div class="val">'+money(goalFY)+'</div><div class="sub">after tax ≈ '+money(goalFY-taxG)+' (tax '+money(taxG)+')</div></div>'
    +'</div><div>'
    +'<div class="statbox"><div class="lbl">Costs to date</div><div class="val" style="color:var(--red)">'+money(s.costToDate)+'</div><div class="sub">projected FY costs '+money(s.costFY)+' (recurring scheduled to 30 Jun)</div></div>'
    +'<div class="statbox"><div class="lbl">Profit to date (income − costs)</div><div class="val">'+money(s.profitToDate)+'</div><div class="sub">after tax ≈ '+money(s.profitToDate-incomeTax(s.profitToDate))+' (tax on profit '+money(incomeTax(s.profitToDate))+')</div></div>'

  /* quoting benchmarks — what past jobs actually took */

    (bm[k]=bm[k]||{n:0,h:0,f:0,d:0}); bm[k].n++; bm[k].h+=hh; bm[k].f+=ff; bm[k].d+=Number(pr.dwell)||0; }

  if(exp.length){
    h+='<h4 style="font-size:12px;margin:14px 0 6px">Expected invoicing (accepted jobs, scheduled)</h4><table class="grid"><tr><th>Expected</th><th>Job</th><th>Stage</th><th>ex GST</th><th>incl GST</th></tr>';
    for(const x of exp) h+='<tr class="clickable" onclick="selectProj(\''+x.id+'\')"><td>'+dmy(x.d)+'</td><td>'+x.job+'</td><td>'+x.stage+'</td><td>'+money2(x.v)+'</td><td>'+money2(x.v*(1+GST))+'</td></tr>';
    h+='</table>';
  }
  if(!pays.length&&!exp.length) h+='<div class="banner">No paid or expected income yet — log statuses on the Project Data tab (income projects once a fee is <b>Accepted</b>).</div>';
  h+='</div></section>';
  return h;
}
function drawIncome(){
  const cv=document.getElementById("incChart"); if(!cv) return;
  const s=fySeries(); const ctx=cv.getContext("2d");
  const W=cv.width,H=cv.height, L=70,R=20,Tp=20,B=40;
  ctx.clearRect(0,0,W,H);
  const goalPerDay=T.goal/7;
  const yMax=Math.max(goalPerDay*s.nDays, s.projFY, s.expFY, s.toDate, s.costFY, 10000)*1.08;
  const x=i=>L+(W-L-R)*i/(s.nDays-1);
  const y=v=>H-B-(H-B-Tp)*v/yMax;
  ctx.font="11px Segoe UI"; ctx.fillStyle="#6b7280";
  const st=pd(s.start);
  for(let m=0;m<=12;m++){
    const d=new Date(st.getFullYear(),st.getMonth()+m,1);
    const i=Math.round((d-st)/86400000); if(i<0||i>s.nDays-1) continue;
    ctx.strokeStyle="#eef2f7"; ctx.beginPath(); ctx.moveTo(x(i),Tp); ctx.lineTo(x(i),H-B); ctx.stroke();
    if(m<12) ctx.fillText(d.toLocaleString("en-AU",{month:"short"}), x(i)+4, H-B+16);
  }
  const stepv=yMax>200000?50000:yMax>80000?25000:10000;
  for(let v=0;v<=yMax;v+=stepv){
    ctx.strokeStyle="#eef2f7"; ctx.beginPath(); ctx.moveTo(L,y(v)); ctx.lineTo(W-R,y(v)); ctx.stroke();
    ctx.fillStyle="#6b7280"; ctx.fillText("$"+(v/1000)+"k", 8, y(v)+4);
  }
  ctx.strokeStyle="#cbd5e1"; ctx.beginPath(); ctx.moveTo(L,H-B); ctx.lineTo(W-R,H-B); ctx.moveTo(L,Tp); ctx.lineTo(L,H-B); ctx.stroke();
  /* goal — dotted grey */
  ctx.strokeStyle="#6b7280"; ctx.setLineDash([2,3]); ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(x(0),y(0)); ctx.lineTo(x(s.nDays-1),y(goalPerDay*s.nDays)); ctx.stroke();
  /* expected schedule — orange (solid to today, dashed beyond) */
  ctx.strokeStyle="#ea580c"; ctx.lineWidth=2; ctx.setLineDash([]);
  ctx.beginPath();
  for(let i=0;i<s.elapsed;i++){ const px=x(i),py=y(s.cumExp[i]); if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py); }
  ctx.stroke();
  ctx.setLineDash([5,4]);
  ctx.beginPath(); ctx.moveTo(x(s.elapsed-1),y(s.cumExp[s.elapsed-1]));
  for(let i=s.elapsed;i<s.nDays;i++) ctx.lineTo(x(i),y(s.cumExp[i]));
  ctx.stroke();
  /* projected — blue dashed from today to EOY */
  ctx.strokeStyle="#2563eb"; ctx.setLineDash([7,5]); ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(x(s.elapsed-1),y(s.toDate)); ctx.lineTo(x(s.nDays-1),y(s.projFY)); ctx.stroke();
  ctx.setLineDash([]);
  /* costs — red (solid to today, dashed scheduled future) */
  ctx.strokeStyle="#dc2626"; ctx.lineWidth=2; ctx.setLineDash([]);
  ctx.beginPath();
  for(let i=0;i<s.elapsed;i++){ const px=x(i),py=y(s.cumCost[i]); if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py); }
  ctx.stroke();
  ctx.setLineDash([4,4]);
  ctx.beginPath(); ctx.moveTo(x(s.elapsed-1),y(s.cumCost[s.elapsed-1]));
  for(let i=s.elapsed;i<s.nDays;i++) ctx.lineTo(x(i),y(s.cumCost[i]));
  ctx.stroke(); ctx.setLineDash([]);
  /* paid — green solid on top */
  ctx.strokeStyle="#16a34a"; ctx.lineWidth=2.5;
  ctx.beginPath();
  for(let i=0;i<s.elapsed;i++){ const px=x(i),py=y(s.cumPaid[i]); if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py); }
  ctx.stroke();
  const ti=s.elapsed-1;
  ctx.fillStyle="#16a34a"; ctx.beginPath(); ctx.arc(x(ti),y(s.cumPaid[ti]),4,0,7); ctx.fill();
  ctx.fillStyle="#1f2937"; ctx.font="bold 11px Segoe UI";
  ctx.fillText("today "+money(s.toDate), Math.min(x(ti)+8,W-150), y(s.cumPaid[ti])-8);
  ctx.lineWidth=1;
}

/* ---------- tab 4: Calendar ---------- */
function calNav(n){ const [y,m]=T.calYM.split("-").map(Number); const d=new Date(y,m-1+n,1); T.calYM=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); save(); render(); }
function calEvents(){
  const ev={};
  const push=(d,e)=>{ (ev[d]=ev[d]||[]).push(e); };
  const receipts=expectedReceipts();
  for(const x of receipts) push(x.d,{txt:x.job+" · "+x.stage.replace(" (expected)","")+" "+money(x.v),id:x.id,pay:true,late:false});
  for(const p of T.projects){
    if(p.hold) continue;
    const dl=deadlineOf(p); if(!dl) continue;
    const c=curStatus(p);
    const dup=receipts.some(x=>x.id===p.id && x.d===dl.due);
    if(dup) continue; /* payment entry already shown that day */
    const late=daysBetween(todayISO(),dl.due)<0;
    push(dl.due,{txt:(p.job||"#"+p.id)+" · "+dl.act,id:p.id,pay:["INVP","INVF"].includes(c.st),late});
  }
  return ev;
}
function pageCal(){
  const [y,m]=T.calYM.split("-").map(Number);
  const first=new Date(y,m-1,1);
  const startDow=(first.getDay()+6)%7; /* Monday first */
  const dim=new Date(y,m,0).getDate();
  const ev=calEvents(); const today=todayISO();
  let h='<section class="card"><div class="sec-head">'
    +'<button class="abtn" onclick="calNav(-1)">‹ prev</button>'
    +'<h2 style="text-align:center">'+first.toLocaleString("en-AU",{month:"long",year:"numeric"})+'</h2>'
    +'<button class="abtn" onclick="calNav(1)">next ›</button>'
    +'</div><div class="sec-body">'
    +'<div style="font-size:11px;color:var(--muted)">Each job’s next deadline &amp; action. <span class="chip pay" style="background:var(--green-bg);color:var(--green)">green $</span> = invoice payment expected · red = overdue · on-hold jobs hidden · click an entry to open the job.</div>'
    +'<div class="cal">'
    +["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map(d=>'<div class="dow">'+d+'</div>').join("");
  for(let i=0;i<startDow;i++) h+='<div class="day other"></div>';
  for(let d=1;d<=dim;d++){
    const isoD=y+"-"+String(m).padStart(2,"0")+"-"+String(d).padStart(2,"0");
    h+='<div class="day'+(isoD===today?' today':'')+'"><div class="dn">'+d+'</div>';
    for(const e of (ev[isoD]||[])){
      h+='<button class="evt'+(e.late?' late':(e.pay?' pay':''))+'" onclick="selectProj(\''+e.id+'\')">'+(e.pay&&!e.late?'💰 ':'')+e.txt+'</button>';
    }
    h+='</div>';
  }
  const cells=startDow+dim; const rem=(7-cells%7)%7;
  for(let i=0;i<rem;i++) h+='<div class="day other"></div>';
  h+='</div>';
  /* overdue spill-over list */
  const lateList=[];
  for(const [d,list] of Object.entries(calEvents())) for(const e of list) if(e.late) lateList.push({d,e});
  if(lateList.length){
    h+='<h4 style="font-size:12px;margin:12px 0 6px;color:var(--red)">Overdue actions</h4><table class="grid">';
    for(const x of lateList.sort((a,b)=>a.d<b.d?-1:1)) h+='<tr class="clickable" onclick="selectProj(\''+x.e.id+'\')"><td style="width:110px">'+dmy(x.d)+'</td><td>'+x.e.txt+'</td></tr>';
    h+='</table>';
  }
  h+='</div></section>';
  return h;
}

/* ---------- tab 5: Costs ---------- */
function costFYTotal(c){
  const occ=costOccurrences(fyStartISO(),fyEndISO()).filter(x=>x.id===c.id);
  return occ.reduce((a,x)=>a+x.v,0);
}
function pageCosts(){
  const start=fyStartISO(), end=fyEndISO(), today=todayISO();
  let h='<section class="card"><div class="sec-head"><h2>Costs — tax-deductible items, subscriptions &amp; recurring costs (ex GST)</h2><button class="addrow" onclick="newCost()">+ add cost</button></div><div class="sec-body">';
  if(!T.costs.length){
    h+='<div class="banner">No costs yet — add one-off deductible purchases (equipment, insurance, accreditation) or recurring subscriptions (software, phone). Recurring costs are automatically scheduled through the financial year and appear as the red line on the Projection chart, and profit figures deduct them.</div>';
  } else {
    h+='<table class="grid"><tr><th>Description</th><th>Category</th><th>Amount ex GST</th><th>Frequency</th><th>Start / date</th><th>End (optional)</th><th>This FY total</th><th></th></tr>';
    for(const c of T.costs){
      const opt=(list,cur)=>list.map(o=>'<option'+(cur===o?' selected':'')+'>'+o+'</option>').join("");
      h+='<tr>'
        +'<td style="min-width:150px"><div class="cell"><input type="text" data-cid="'+c.id+'" data-cf="desc" value="'+String(c.desc||"").replace(/"/g,"&quot;")+'" placeholder="e.g. FirstRate5 licence"></div></td>'
        +'<td><div class="cell"><select data-cid="'+c.id+'" data-cf="cat"><option value="">—</option>'+opt(COSTCATS,c.cat)+'</select></div></td>'
        +'<td style="width:110px"><div class="cell"><input type="number" step="any" data-cid="'+c.id+'" data-cf="amt" value="'+(c.amt||"")+'"></div></td>'
        +'<td><div class="cell"><select data-cid="'+c.id+'" data-cf="freq">'+opt(FREQS,c.freq||"one-off")+'</select></div></td>'
        +'<td style="width:130px"><div class="cell"><input type="date" data-cid="'+c.id+'" data-cf="start" value="'+(c.start||"")+'"></div></td>'
        +'<td style="width:130px"><div class="cell"><input type="date" data-cid="'+c.id+'" data-cf="end" value="'+(c.end||"")+'"'+((c.freq&&c.freq!=="one-off")?'':' disabled')+'></div></td>'
        +'<td style="white-space:nowrap"><b>'+money(costFYTotal(c))+'</b></td>'
        +'<td><button class="abtn del" onclick="delCost(\''+c.id+'\')">🗑</button></td></tr>';
    }
    h+='</table>';
    const occ=costOccurrences(start,end);
    const toDate=occ.filter(x=>x.d<=today).reduce((a,x)=>a+x.v,0);
    const fy=occ.reduce((a,x)=>a+x.v,0);
    h+='<div style="margin-top:10px">'
      +'<div class="statbox"><div class="lbl">Costs to date (this FY)</div><div class="val" style="color:var(--red)">'+money(toDate)+'</div></div>'
      +'<div class="statbox"><div class="lbl">Projected FY costs</div><div class="val" style="color:var(--red)">'+money(fy)+'</div><div class="sub">one-offs + recurring scheduled to 30 Jun</div></div>'
      +'<div class="statbox"><div class="lbl">Average per week</div><div class="val">'+money(fy/52)+'</div><div class="sub">across the full FY</div></div>'
      +'</div>';
    /* upcoming 8 weeks */
    const up=occ.filter(x=>x.d>today&&x.d<=addDays(today,56));
    if(up.length){
      h+='<h4 style="font-size:12px;margin:12px 0 6px">Upcoming costs (next 8 weeks)</h4><table class="grid"><tr><th>Date</th><th>Description</th><th>Category</th><th>ex GST</th></tr>';
      for(const x of up) h+='<tr><td>'+dmy(x.d)+'</td><td>'+(x.desc||"—")+'</td><td>'+(x.cat||"—")+'</td><td>'+money2(x.v)+'</td></tr>';
      h+='</table>';
    }
  }
  h+='<div style="font-size:11px;color:var(--muted);margin-top:8px">Enter amounts ex GST (if GST-registered you claim the GST separately on your BAS). These feed the red costs line on the Projection tab and are deducted before tax in the profit figures. Whether an item is actually deductible is one for your accountant.</div>';
  h+='</div></section>';
  return h;
}

/* ---------- shared render ---------- */
function updateCounts(){
  let overdue=0, active=0, done=0, hold=0, pipeline=0;
  for(const p of T.projects){
    if(p.hold){ hold++; continue; }
    const c=curStatus(p);
    if(c&&c.st==="DONE"){ done++; continue; }
    active++;
    const dl=deadlineOf(p);
    if(dl && daysBetween(todayISO(),dl.due)<0) overdue++;
    pipeline+=pendingValue(p).v;
  }
  document.getElementById("counts").innerHTML=
    '<span class="pill blue">'+active+' active</span>'
    +'<span class="pill '+(overdue?"red":"green")+'">'+overdue+' overdue</span>'
    +(hold?'<span class="pill orange">'+hold+' on hold</span>':'')
    +'<span class="pill grey">'+done+' complete</span>'
    +'<span class="pill purple">'+money(pipeline)+' pipeline ex GST</span>';
}
function render(){
  document.getElementById("fyLbl").textContent=fyStartISO().slice(0,4)+"/"+fyEndISO().slice(2,4);
  document.getElementById("pagenav").innerHTML=PAGES.map(([id,l])=>'<button class="'+(T.page===id?"active":"")+'" onclick="setPage(\''+id+'\')">'+l+'</button>').join("");
  const app=document.getElementById("app");
  app.innerHTML = T.page==="data"? pageData() : T.page==="roster"? pageRoster() : T.page==="cal"? pageCal() : T.page==="costs"? pageCosts() : pageIncome();
  updateCounts();
  if(T.page==="income") drawIncome();
}

/* ---------- events: no re-render while typing ---------- */
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset.goal){ const v=Number(t.value); if(v>0) T.goal=v; save(); return; }
  if(t.dataset.cid){ const c=T.costs.find(x=>x.id===t.dataset.cid); if(c){ c[t.dataset.cf]=t.value; save(); if(t.tagName==="SELECT") render(); } return; }
  if(t.dataset.lh!=null&&t.dataset.lh!==""){ const pp=curProj(); if(pp){ const ev=pp.log[Number(t.dataset.lh)];
      if(ev){ const v=Number(t.value); if(isFinite(v)&&v>0) ev.h=v; else delete ev.h; save(); } } return; }
  const p=curProj(); if(!p) return;
  if(t.dataset.pf){ p[t.dataset.pf]=t.value; save(); if(t.tagName==="SELECT") render(); return; }
  if(t.dataset.pfinc){ const v=Number(t.value); p[t.dataset.pfinc]= isFinite(v)&&t.value!==""? +(v/(1+GST)).toFixed(2) : ""; save(); return; }
});
document.addEventListener("focusout",e=>{
  const t=e.target;
  if(t && t.dataset && (t.dataset.pf||t.dataset.pfinc||t.dataset.goal||t.dataset.cid||t.dataset.lh!=null) && t.tagName!=="SELECT"){
    clearTimeout(window.__rrT);
    window.__rrT=setTimeout(()=>{ const a=document.activeElement; if(!a||!a.dataset||!(a.dataset.pf||a.dataset.pfinc||a.dataset.goal||a.dataset.cid||a.dataset.lh!=null)) render(); },200);
  }
});

/* ---------- handoff to the Project Data Tool ---------- */
function openInDataTool(id){
  const p=proj(id); if(!p) return;
  if(!(p.job&&String(p.job).trim())){ alert("Enter a job number first — it names this project's instance in the Project Data Tool."); return; }
  const h={job:String(p.job).trim(), client:p.client||"", designer:p.designer||"", addr:p.addr||"", type:p.type||"", dwell:p.dwell||""};
  try{ localStorage.setItem("p13_handoff",JSON.stringify(h)); }catch(e){}
  window.open("Part13_Data_Tool_v2.html#handoff="+encodeURIComponent(JSON.stringify(h)),"_blank");
}

/* ---------- import / export ---------- */
function exportJSON(){
  const blob=new Blob([JSON.stringify(T,null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download="project_tracker_"+todayISO()+".json"; a.click();
}
function importJSON(ev){
  const f=ev.target.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=()=>{ try{ const j=JSON.parse(rd.result); if(j.projects){ T=j; ensureShape(); save(); render(); } else alert("Not a tracker file."); }catch(e){ alert("Import failed: "+e.message); } };
  rd.readAsText(f); ev.target.value="";
}

/* ---------- Google Drive sync ----------
   Projects and costs merge record by record: newest edit to a given record
   wins, and a record that exists on only one device is always kept. Settings
   (goal, current page, calendar month) merge as one block by settingsAt. */
const byId=arr=>{ const o={}; for(const r of (arr||[])) if(r&&r.id!=null) o[r.id]=r; return o; };
const toArr=map=>Object.keys(map).map(k=>map[k]);

function mergeTracker(st){
  if(!st||!st.projects) return false;
  try{
    stampChanges();                       /* make sure local edits are stamped first */
    const P=GSync.mergeMaps(byId(T.projects), byId(st.projects), T.tombs, st.tombs);
    const C=GSync.mergeMaps(byId(T.costs),    byId(st.costs),    T.tombs, st.tombs);
    const keepCur = T.cur && P.map[T.cur] ? T.cur : (st.cur && P.map[st.cur] ? st.cur : null);
    const set = GSync.mergeSettings(
      {goal:T.goal, calYM:T.calYM},
      {goal:st.goal, calYM:st.calYM},
      T.settingsAt, st.settingsAt);
    T.projects = toArr(P.map);
    T.costs    = toArr(C.map);
    T.tombs    = Object.assign({}, P.tombs, C.tombs);
    T.goal     = set.goal; T.calYM = set.calYM;
    T.cur      = keepCur;                 /* stay where we are; never follow the other device */
    T.settingsAt = GSync.ts(st.settingsAt)>GSync.ts(T.settingsAt) ? st.settingsAt : T.settingsAt;
    ensureShape();
    try{ localStorage.setItem(STKEY,JSON.stringify(T)); }catch(e){}
    baseline();
  }catch(e){ return false; }
  render();
  return true;
}
function gsyncInit(){
  if(!window.GSync) return;
  GSync.init({ app:"tracker", fileName:"SectionH_ProjectTracker.json",
    device:(navigator.platform||"device"),
    getState:()=>{ stampChanges(); return T; },
    mergeState:mergeTracker,
    setState:st=>{ T=st; ensureShape(); try{ localStorage.setItem(STKEY,JSON.stringify(T)); }catch(e){} baseline(); render(); } });
}

/* boot */
load(); render(); gsyncInit();
</script>
